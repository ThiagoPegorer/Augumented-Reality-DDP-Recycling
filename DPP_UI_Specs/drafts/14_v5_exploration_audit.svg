<circle cx="28" cy="561" r="8" fill="#e24b4a"/><text x="28" y="564.5" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="44" y="565" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.4" fill="#9fb3d1">CTA is the pre-v3 single 328-wide button at x 288 — the standard bottom bar is secondary 180 + primary 388 with mirror margins; no Home/back pill here at all</text>
<circle cx="28" cy="580" r="8" fill="#e24b4a"/><text x="28" y="583.5" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="44" y="584" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.4" fill="#9fb3d1">NOT DRAWN: the three detail shells still show icons + 'Full entry is not built yet.' placeholders; headers inconsistent with the five 13-family pages</text>
