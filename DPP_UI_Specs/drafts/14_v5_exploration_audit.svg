<text x="44" y="527" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.4" fill="#9fb3d1">all three blocks are chromed cards that are TAPPABLE ANYWHERE (MakeTappable + chevron) — the chrome=touchable rule everywhere else now means + circles on inert cards</text>
