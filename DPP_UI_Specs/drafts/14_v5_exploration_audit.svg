<text x="20" y="14" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">Composition &amp; impact (model exploration) — AS CODED (spec 14 v2, pre-standards). Violations numbered. Values illustrative; the real ones are bound.</text>
