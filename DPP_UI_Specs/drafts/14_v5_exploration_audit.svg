<text x="44" y="508" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.4" fill="#9fb3d1">header is the OLD MakeScreenHeader: back arrow + eyebrow + 19 pt title — the DPP Canva dropped all three in v3; every back edge elsewhere is now a labelled pill or the shell circle</text>
