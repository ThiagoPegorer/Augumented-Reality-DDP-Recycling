<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cancel-disassembly modal — appears on Back from any step</title>
<desc>Step screen dimmed behind a centered modal card asking Want to cancel this disassembly, with a green Yes button and a red No button.</desc>
<rect width="680" height="520" fill="#000000"/>
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- dimmed step screen behind (simplified) -->
<g opacity="0.35">
<rect x="42" y="46" width="8" height="378" rx="4" fill="#122c55"/>
<rect x="42" y="46" width="8" height="75.6" rx="4" fill="#35d0a0"/>
<circle cx="90" cy="66" r="18" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<text x="72" y="130" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Open the housing</text>
<circle cx="90" cy="180" r="18" fill="#e24b4a"/>
<circle cx="90" cy="248" r="18" fill="#e24b4a"/>
<rect x="72" y="370" width="150" height="52" rx="13" fill="#1a2740" stroke="#324a6d" stroke-width="1.5"/>
<rect x="234" y="370" width="398" height="52" rx="13" fill="#1a2740" stroke="#324a6d" stroke-width="1.5"/>
</g>

<!-- dim overlay -->
<rect x="20" y="20" width="640" height="430" rx="22" fill="#000000" opacity="0.55"/>

<!-- modal card -->
<rect x="139" y="149" width="402" height="172" rx="20" fill="none" stroke="#2e5aa0" stroke-width="2"/>
<rect x="140" y="150" width="400" height="170" rx="20" fill="#0d2a57"/>
<text x="340" y="212" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Want to cancel this disassembly?</text>

<!-- Yes (green) -->
<rect x="183" y="242" width="150" height="46" rx="13" fill="#1d9e75"/>
<text x="258" y="271" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Yes</text>

<!-- No (red) -->
<rect x="347" y="242" width="150" height="46" rx="13" fill="#e24b4a"/>
<text x="422" y="271" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">No</text>

<!-- Grabber bar -->
<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1"/>
<rect x="318" y="471" width="44" height="4" rx="2" fill="#6b7686"/>
</svg>
