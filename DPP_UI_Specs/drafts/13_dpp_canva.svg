<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ReBuilt v2.0 — DPP Canva (product info), replaces the Information tab landing</title>
<desc>Navy 640x430 panel. Top-left back arrow returns to Welcome. Four category cards in a 2x2 grid: Identity and manufacturer, Materials and substances, Hazardous and safety, Compliance and end-of-life. The Life cycle analysis card is gone: LCA is now the main panel of the next screen. A single primary CTA continues to the 3D model.</desc>

<!-- panel -->
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- header: back to Welcome (same spot the Home button used to occupy) -->
<circle cx="62" cy="64" r="20" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<g transform="translate(62,64)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 -6 L-4 0 L3 6"/><path d="M-4 0 L8 0"/>
</g>
<text x="96" y="58" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7f9bc4">Digital Product Passport</text>
<text x="96" y="78" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffffff">Vehicle Control Unit</text>
<text x="636" y="70" text-anchor="end" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#7f9bc4">scanned · vcu_001</text>
<line x1="44" y1="96" x2="636" y2="96" stroke="#1a335f" stroke-width="1"/>

<!-- card 1 — Identity -->
<rect x="44" y="110" width="290" height="110" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(72,165)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="0" cy="-4" r="4"/><path d="M-6 9 a6 7 0 0 1 12 0"/></g>
<text x="96" y="152" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Identity &amp;</text>
<text x="96" y="172" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">manufacturer</text>
<text x="96" y="194" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb3d1">Bosch Motorsport · MS 50.4</text>
<polyline points="306,158 314,166 306,174" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- card 2 — Materials -->
<rect x="346" y="110" width="290" height="110" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(374,165)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-5 -5 L5 -5 L5 5 L-5 5 Z"/><path d="M-2 -1 L2 -1 M-2 2 L2 2"/></g>
<text x="398" y="152" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Materials &amp;</text>
<text x="398" y="172" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">substances</text>
<text x="398" y="194" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#9fe1cb">Al housing · Au 63 · Ag 251 · Pd 28 mg</text>
<polyline points="608,158 616,166 608,174" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- card 3 — Hazardous -->
<rect x="44" y="232" width="290" height="110" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(72,287)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 -8 L8 6 L-8 6 Z"/><path d="M0 -2 L0 1.5"/><path d="M0 4 L0 4.01"/></g>
<text x="96" y="274" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Hazardous &amp;</text>
<text x="96" y="294" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">safety</text>
<text x="96" y="316" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb3d1">no battery · lead-free solder</text>
<polyline points="306,280 314,288 306,296" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- card 4 — Compliance -->
<rect x="346" y="232" width="290" height="110" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(374,287)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-5 -6 L5 -6 L5 6 L-5 6 Z"/><path d="M-2 0 L0 2 L3 -3"/></g>
<text x="398" y="274" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Compliance &amp;</text>
<text x="398" y="294" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">end-of-life</text>
<text x="398" y="316" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb3d1">WEEE cat. 5 · selective treatment</text>
<polyline points="608,280 616,288 608,296" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- footer: hint + single forward CTA (back lives top-left, per 02 §5) -->
<text x="44" y="398" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6f86a8">Tap a card to read that part of</text>
<text x="44" y="414" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6f86a8">the passport.</text>
<rect x="308" y="372" width="328" height="52" rx="13" fill="#1d9e75"/>
<text x="462" y="404" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Continue to 3D model</text>
<polyline points="600,390 608,398 600,406" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- grabber bar (00 §5) -->
<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1.5"/>
<line x1="305" y1="473" x2="375" y2="473" stroke="#6b7686" stroke-width="3" stroke-linecap="round"/>
</svg>
