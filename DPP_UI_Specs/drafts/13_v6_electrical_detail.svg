<svg width="100%" viewBox="0 0 680 578" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Electrical data — detail page from the Bosch MS 50.4 datasheet</title>
<desc>The detail page opened by the plus button on the Electrical data tile. Shell chrome with a back arrow and title, a supply voltage hero, and five blocks: inputs, outputs, sensor supplies, connectors and communication, each listing values taken from the Bosch Motorsport datasheet and bound to a new electrical block in the payload.</desc>
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>
<circle cx="62" cy="64" r="21.5" fill="#2e5aa0"/><circle cx="62" cy="64" r="20" fill="#13366b"/>
<g stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M65 58 L58 64 L65 70"/><path d="M58 64 L70 64"/></g>
<g stroke="#7fd3b6" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M98 56 L92 65 L96 65 L94 72 L100 63 L96 63 Z"/></g>
<text x="114" y="71" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold">Electrical data</text>
<text x="636" y="68" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8" text-anchor="end">basis: datasheet</text>
<rect x="44" y="96" width="592" height="1" fill="#1a335f"/>
<rect x="345" y="107" width="292" height="52" rx="13" fill="#2e5aa0"/><rect x="346" y="108" width="290" height="50" rx="13" fill="#0e2950"/>
<text x="360" y="128" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7f9bc4">Supply voltage</text>
<text x="622" y="143" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="end">5 to 18 V</text>
<rect x="43" y="107" width="292" height="128" rx="13" fill="#21407a"/><rect x="44" y="108" width="290" height="126" rx="13" fill="#0e2950"/>
<text x="58" y="130" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#5dcaa5" font-weight="bold">INPUTS</text>
<text x="58" y="150" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">20 x analog 0–5 V, 0.5 % precision</text>
<text x="58" y="165" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">8 x digital PWM in, f_max 30 kHz</text>
<text x="58" y="180" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">4 x digital PWM in, Hall / DF11 speed</text>
<text x="58" y="195" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">4 x universal thermocouple</text>
<text x="58" y="210" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">1 x Bosch Laptrigger</text>
<text x="58" y="225" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">1 x TimeSync master and slave</text>
<rect x="43" y="241" width="292" height="68" rx="13" fill="#21407a"/><rect x="44" y="242" width="290" height="66" rx="13" fill="#0e2950"/>
<text x="58" y="264" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#5dcaa5" font-weight="bold">OUTPUTS</text>
<text x="58" y="284" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">2 x PWM high side, 7.5 A, 50 Hz</text>
<text x="58" y="299" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">4 x PWM low side, 2.2 A, 10 kHz</text>
<rect x="43" y="315" width="292" height="98" rx="13" fill="#21407a"/><rect x="44" y="316" width="290" height="96" rx="13" fill="#0e2950"/>
<text x="58" y="338" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#5dcaa5" font-weight="bold">SENSOR SUPPLIES</text>
<text x="58" y="358" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">5 x 12 V, 400 mA each</text>
<text x="58" y="373" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">5 x switchable 5 V / 12 V, 400 mA</text>
<text x="58" y="388" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">4 A max on 12 V · 2 A max on 5 V</text>
<text x="58" y="403" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">20 x sensor ground</text>
<rect x="345" y="165" width="292" height="98" rx="13" fill="#21407a"/><rect x="346" y="166" width="290" height="96" rx="13" fill="#0e2950"/>
<text x="360" y="188" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#5dcaa5" font-weight="bold">CONNECTORS</text>
<text x="360" y="208" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">3 motorsport connectors, 198 pins</text>
<text x="360" y="223" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">LIFE (red) AS018-35PN</text>
<text x="360" y="238" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">SENS-A (yellow) AS018-35PA</text>
<text x="360" y="253" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">SENS-B (blue) AS018-35PB</text>
<rect x="345" y="269" width="292" height="128" rx="13" fill="#21407a"/><rect x="346" y="270" width="290" height="126" rx="13" fill="#0e2950"/>
<text x="360" y="292" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#5dcaa5" font-weight="bold">COMMUNICATION</text>
<text x="360" y="312" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">3 x Ethernet 100 Mbit</text>
<text x="360" y="327" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">4 x CAN (+4 with I/O package)</text>
<text x="360" y="342" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">1 x LIN · 1 x USB</text>
<text x="360" y="357" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">1 x RS232 for GPS / telemetry</text>
<text x="360" y="372" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">1 x time sync Ethernet</text>
<text x="360" y="387" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">CCP/XCP master (optional)</text>
<text x="44" y="428" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6f86a8">Source: Bosch Motorsport data sheet 234686731 · 27 Mar 2026 · every line bound to payload electrical.* — no literals in the builder</text>
<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1.5"/>
<line x1="305" y1="473" x2="375" y2="473" stroke="#6b7686" stroke-width="3" stroke-linecap="round"/>
<text x="20" y="14" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">Electrical data — detail page (opened by the "+" on the Electrical data tile). Shell chrome + 6 bound blocks. 640 x 430, panel-local = SVG minus 20.</text>
<text x="20" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#5dcaa5" font-weight="bold">NEW PAYLOAD BLOCK</text>
<text x="146.2" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">electrical { supply_voltage, connector_summary, inputs[], outputs[], sensor_supplies[], connectors[], communication[], basis, source } — added to models.py, dpp_schema.json, DPPModels.cs and vcu_001.json</text>
<text x="20" y="524" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#e2a44a" font-weight="bold">WHY NOT HARDCODE</text>
<text x="139.6" y="524" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">spec 13 §4: v1 shipped hardcoded datasheet strings and two of them silently disagreed with the payload. Same mistake, same file. Every line here is bound.</text>
<text x="20" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#7f9bc4" font-weight="bold">NOT SHOWN</text>
<text x="93.4" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">internal measurements (ambient pressure, ECU temp, 20 x supply voltage/current, 4 x HS output current, 3-axis accel + roll/pitch/yaw) and the High Speed Logging package.</text>
<text x="20" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#e24b4a" font-weight="bold">CHECK</text>
<text x="67.0" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">"0–5 V" uses an en dash (U+2013) — present in the atlas; "≤" and "−" (U+2212) are NOT and must never reach a payload string.</text>
</svg>
