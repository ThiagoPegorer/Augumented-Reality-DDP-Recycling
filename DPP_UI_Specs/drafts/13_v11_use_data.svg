<title>Use data — simulated vehicle telemetry detail page</title>
<desc>The Use data detail page: two hero counters for fifteen years in service and 226,500 km driven, six telemetry tiles covering energy use, distance per year, average speed, drive cycles, operating hours and ECU temperature, and a fault line that links the last logged fault to the repair shown in Service and repair. An inset shows the landing tile face with two chips and the plus circle.</desc>
