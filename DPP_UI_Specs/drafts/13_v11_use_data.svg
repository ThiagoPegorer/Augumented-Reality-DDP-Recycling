<text x="84" y="380" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10" fill="#6f86a8">most recent: intermittent SENS-B signal, Apr 2026 → repaired 14 May 2026 (see Service &amp; repair)</text>
<text x="44" y="428" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.8" fill="#6f86a8">telemetry simulated for the study demonstrator · values cross-check: 14,800 km/y × 0.175 = 2,590 kWh/y · 226,500 ÷ 36 km/h = 6,290 h · 226,500 ÷ 11,300 = 20.0 km</text>
