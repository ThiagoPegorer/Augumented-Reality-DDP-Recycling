<text x="330" y="528" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e2a44a" font-weight="bold">MEASURED ≠ DESIGN, ON PURPOSE</text>
<text x="330" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">226,500 km / 15.3 y sit just past the assumed profile (225,000 / 15). A unit that has COMPLETED its design life is exactly one you dismantle.</text>
<text x="330" y="546" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7f9bc4" font-weight="bold">TIMELINE (accepted fiction)</text>
<text x="330" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">in service Mar 2011 — predates the 2026 datasheet. Nothing shows both dates together; logged in the spec as the demo world's history.</text>
<text x="330" y="564" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5dcaa5" font-weight="bold">CROSS-LINK</text>
<text x="330" y="578" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">the fault line points at the May 2026 SENS-B repair in Service &amp; repair — the two simulated tabs corroborate each other, like real telemetry would.</text>
<text x="330" y="582" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e24b4a" font-weight="bold">DATA HOME</text>
<text x="330" y="596" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">usage_history gains avg_speed_kmh, energy_kwh_per_year, energy_kwh_per_100km, distance_km_per_year, avg_trip_km, ecu_temp_avg_c, ecu_temp_peak_c, fault_events, retired_date · basis simulated (schema v0.11).</text>
