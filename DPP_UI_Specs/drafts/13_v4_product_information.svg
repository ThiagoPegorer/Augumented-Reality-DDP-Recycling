<svg width="100%" viewBox="0 0 680 570" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DPP Canva v4 — CODED: Identity hero replaced by a plain Product information line</title>
<desc>The tappable Identity and specifications card is gone. In its place, two lines of plain text under the rule: the manufacturer and model at 16 pt bold, with the serial number trailing on the same line in small grey type. No label, no card, no icon, no chevron, not tappable. The spec chips, the category caption and the documents status line are removed. The four tiles move up to y 114 and 194, and the free space above the bottom bar grows to 88 px.</desc>

<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- header -->
<text x="44" y="55" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7f9bc4">Digital Product Passport</text>
<rect x="44" y="68" width="592" height="1" fill="#1a335f"/>

<!-- ========== PRODUCT INFORMATION — plain text, NOT a card, NOT tappable ========== -->
<text x="44" y="98" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Bosch Motorsport | Vehicle Control Unit MS 50.4<tspan font-size="11" font-weight="normal" fill="#6f86a8"> - VCU0001</tspan></text>

<!-- ========== four tiles at y 114 / 194 panel-local ========== -->
