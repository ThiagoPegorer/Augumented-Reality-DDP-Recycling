<svg width="100%" viewBox="0 0 980 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>QR viewfinder head-follow — current (horizontal only) vs proposed (full gaze ray)</title>
<desc>Side-view diagram. Left: the current behaviour flattens the gaze vector, so the viewfinder stays on a ring at eye height and the QR code on the table sits far below the brackets. Right: the proposed behaviour places the viewfinder along the real gaze ray and tilts it to face the user, so the brackets land on whatever the participant is looking at.</desc>

<rect x="0" y="0" width="980" height="460" fill="#0a1f44"/>

<!-- ================= LEFT — current ================= -->
<text x="30" y="36" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#e24b4a">NOW — fwd.y = 0</text>
<text x="30" y="56" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">gaze flattened to horizontal · viewfinder locked to eye height</text>

<!-- head -->
<circle cx="80" cy="140" r="20" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<path d="M96 132 L112 126" stroke="#9fb3d1" stroke-width="1.5" stroke-linecap="round"/>
<text x="52" y="180" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7f9bc4">head</text>

<!-- real gaze, pitched down ~35 deg -->
<line x1="96" y1="150" x2="392" y2="357" stroke="#6f86a8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="196" y="248" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8" transform="rotate(35 196 248)">real gaze</text>

<!-- flattened forward -->
<line x1="100" y1="140" x2="300" y2="140" stroke="#e24b4a" stroke-width="1.5"/>
<polyline points="292,135 300,140 292,145" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="132" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e24b4a">fwd.y = 0 → 0.75 m</text>

<!-- viewfinder brackets, upright at eye height -->
<g stroke="#1d9e75" stroke-width="2.5" fill="none" stroke-linecap="round">
  <path d="M262 100 L262 84 L286 84"/><path d="M338 84 L362 84 L362 100"/>
  <path d="M262 180 L262 196 L286 196"/><path d="M338 196 L362 196 L362 180"/>
</g>
<text x="266" y="146" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5dcaa5">viewfinder</text>

<!-- table + QR -->
<line x1="200" y1="366" x2="450" y2="366" stroke="#324a6d" stroke-width="3"/>
<text x="204" y="384" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">table</text>
<g transform="translate(370,344)">
  <rect x="0" y="0" width="26" height="22" fill="#dbe4f0"/>
  <rect x="3" y="3" width="7" height="6" fill="#0a1f44"/><rect x="16" y="3" width="7" height="6" fill="#0a1f44"/>
  <rect x="3" y="13" width="7" height="6" fill="#0a1f44"/><rect x="16" y="13" width="4" height="3" fill="#0a1f44"/>
</g>
<text x="404" y="360" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#dbe4f0">QR on the unit</text>

<!-- mismatch marker -->
<line x1="312" y1="206" x2="368" y2="336" stroke="#e24b4a" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="238" y="290" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#e24b4a">brackets never</text>
<text x="238" y="306" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#e24b4a">reach the code</text>
<text x="238" y="326" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">→ user lifts the VCU</text>

<line x1="490" y1="30" x2="490" y2="430" stroke="#1a335f" stroke-width="1"/>

<!-- ================= RIGHT — proposed ================= -->
<text x="520" y="36" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#5dcaa5">PROPOSED — full gaze ray</text>
<text x="520" y="56" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">placed along head.forward · tilted to face the user · same lazy lerp</text>

<circle cx="570" cy="140" r="20" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<path d="M586 132 L602 126" stroke="#9fb3d1" stroke-width="1.5" stroke-linecap="round"/>

<!-- gaze ray, now the placement axis -->
<line x1="586" y1="150" x2="882" y2="357" stroke="#1d9e75" stroke-width="1.5"/>
<polyline points="874,346 882,357 869,356" fill="none" stroke="#1d9e75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="672" y="238" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5dcaa5" transform="rotate(35 672 238)">0.75 m along gaze</text>

<!-- viewfinder brackets, on the ray and tilted 35 deg to face the head -->
<g transform="rotate(35 750 262)">
  <g stroke="#1d9e75" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M700 222 L700 206 L724 206"/><path d="M776 206 L800 206 L800 222"/>
    <path d="M700 302 L700 318 L724 318"/><path d="M776 318 L800 318 L800 302"/>
  </g>
</g>
<text x="612" y="300" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5dcaa5">viewfinder follows</text>
<text x="612" y="316" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5dcaa5">pitch as well as yaw</text>

<!-- table + QR -->
<line x1="690" y1="366" x2="940" y2="366" stroke="#324a6d" stroke-width="3"/>
<g transform="translate(860,344)">
  <rect x="0" y="0" width="26" height="22" fill="#dbe4f0"/>
  <rect x="3" y="3" width="7" height="6" fill="#0a1f44"/><rect x="16" y="3" width="7" height="6" fill="#0a1f44"/>
  <rect x="3" y="13" width="7" height="6" fill="#0a1f44"/><rect x="16" y="13" width="4" height="3" fill="#0a1f44"/>
</g>
<text x="806" y="392" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#5dcaa5">code sits inside the brackets</text>
<text x="806" y="408" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">from the user's viewpoint — no lifting</text>

<!-- footer note -->
<text x="30" y="440" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">ZXing decodes the WHOLE camera frame — the brackets were always a framing aid, not a scan region. This makes the aid tell the truth.</text>
</svg>
