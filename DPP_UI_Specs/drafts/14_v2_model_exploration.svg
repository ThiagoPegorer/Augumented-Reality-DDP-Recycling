<svg width="100%" viewBox="0 0 1080 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Model Exploration v2 — composition hero + impact tiles + circularity indicators, beside the action zone</title>
<desc>Left: navy 640x430 panel titled Composition and impact. A full-width composition-by-mass bar with legend acts as the Materials and composition entry, using the CIRPASS Figure 13 convention. Two impact tiles below show the lifecycle footprint and the recovery potential, both opening a life cycle detail modal. A full-width indicators row shows the three circularity indices as not provided. Right: the transparent action zone with the exploded 3D model, grab circle and gesture column. Timing has not started on this screen.</desc>

<!-- ================= LEFT: instruction panel ================= -->
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<circle cx="62" cy="64" r="20" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<g transform="translate(62,64)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 -6 L-4 0 L3 6"/><path d="M-4 0 L8 0"/></g>
<text x="96" y="58" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7f9bc4">Digital Product Passport</text>
<text x="96" y="78" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffffff">Composition &amp; impact</text>
<text x="636" y="70" text-anchor="end" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#7f9bc4">660 g · 12 material lines</text>
<line x1="44" y1="96" x2="636" y2="96" stroke="#1a335f" stroke-width="1"/>

