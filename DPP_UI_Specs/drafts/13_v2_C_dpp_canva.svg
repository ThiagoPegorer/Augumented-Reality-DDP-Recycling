<g transform="translate(70,132)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="0" cy="-4" r="4"/><path d="M-6 8 a6 6 0 0 1 12 0"/></g>
<text x="92" y="130" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Identity &amp; specifications</text>
<text x="606" y="130" text-anchor="end" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">EEE · WEEE cat. 5</text>
<polyline points="616,124 623,130 616,136" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

