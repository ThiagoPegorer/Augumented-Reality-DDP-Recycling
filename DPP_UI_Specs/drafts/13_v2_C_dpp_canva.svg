<text x="503" y="176" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#dbe4f0">3 connectors</text>

<circle cx="75" cy="192" r="3.5" fill="none" stroke="#6f86a8" stroke-width="1.4"/>
