<text x="20" y="512" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">Tab 3 headline is three EF 3.1 categories, written as given · chips would not fit three rows plus the caption,</text>
<text x="20" y="529" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">so these are text rows: category in text/secondary, value in white bold</text>
<text x="20" y="546" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">CHECK: 73.25 does not match impact_EF31.csv, which gives 73.4326 kg CO2 eq for sc1 (cradle to grave).</text>
<text x="20" y="563" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">The other two values match the csv sc1 baselines exactly (0.0187391 Sb eq, 0.11592 P eq) - so one number</text>
<text x="20" y="580" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">appears to exclude end of life while the other two include it. Confirm before this reaches the thesis.</text>
