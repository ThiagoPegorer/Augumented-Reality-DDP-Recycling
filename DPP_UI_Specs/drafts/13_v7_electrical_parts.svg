<text x="20" y="14" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">Electrical data — "+" page, rebuilt around YOUR prototype. Names + colour swatches + one photo per part. 640 x 430.</text>
<text x="20" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#e24b4a" font-weight="bold">I NEED FROM YOU</text>
<text x="133.0" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">4 photos of the printed parts on a plain background, roughly 3:2. I will trim, square and import them to Assets/Textures/Parts/ as connectors.png, processors.png, cpu.png, sensors.png.</text>
<text x="20" y="524" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#e2a44a" font-weight="bold">NAMING CLASH</text>
<text x="113.19999999999999" y="524" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">payload disassembly.parts already reads [VCU case, PCB board, 3 processors, 3 chips, 3 connectors, 14 screws]. Your 2 processors + 1 CPU = its "3 processors"; your 3 sensors = its "3 chips".</text>
<text x="20" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">The disassembly steps use that older vocabulary, so participants would meet two names for the same object. Reconciling it is one payload edit — say the word.</text>
<text x="20" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#5dcaa5" font-weight="bold">COLOUR IS THE WAYFINDING</text>
<text x="192.39999999999998" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">the swatches are the point: a participant matches the dot to the part in their hands. Worth keeping even once photos land.</text>
</svg>
