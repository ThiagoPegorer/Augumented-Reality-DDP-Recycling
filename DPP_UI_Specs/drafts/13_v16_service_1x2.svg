<text x="330" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">60 quarterly updates Apr 2011 (v1.1) → Jan 2026 (v15.4) · repairs: 0 in years 1–5, 2/yr in 6–10, 3/yr in 11–15 = 25, rising toward end of life. Everything ends before the Mar 2026 retirement — the old Mar–Jul 2026 history postdated it.</text>
<text x="330" y="554" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e2a44a" font-weight="bold">⚠ v15.1 vs v15.4</text>
<text x="330" y="568" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">quarterly to the end of service mathematically ends at v15.4 (Jan 2026). Drawn so; say if you want the series truncated at v15.1 (Apr 2025) instead.</text>
<text x="330" y="572" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7f9bc4" font-weight="bold">WHAT DIES</text>
<text x="330" y="586" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">the counter cards + subtitles, the timeline card, the amber caption, the 5-row log + footer, the fortnightly v4.x story, the → glyph bug (deleted with the version-range label), the tile dot rows.</text>
<text x="330" y="590" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e24b4a" font-weight="bold">NO STATS COLUMN</text>
<text x="330" y="604" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">the 1x2 layout has no slot for totals beyond the card headers (REPAIRS · 25 / UPDATES · 60) and the tile chips. Cost € totals, cadence and next-update all die — flag now if any must survive.</text>
