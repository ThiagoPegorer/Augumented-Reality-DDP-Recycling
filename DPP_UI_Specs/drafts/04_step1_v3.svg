<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Disassembly step 1 v3 — unboxed task rows with red/green completion buttons, gated Confirm</title>
<desc>Instruction canvas: progress rail, header, step title, two unboxed task rows with clickable status circles (one green done with checkmark, one red pending), a hint line, how-to panel with loop badge, Back button and a locked grey Confirm and next button.</desc>
<rect width="680" height="520" fill="#000000"/>
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- Progress rail -->
<rect x="42" y="46" width="8" height="378" rx="4" fill="#122c55"/>
<rect x="42" y="46" width="8" height="75.6" rx="4" fill="#35d0a0"/>
<text x="46" y="440" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#5fae94" text-anchor="middle">1/5</text>

<!-- Header -->
<circle cx="90" cy="66" r="18" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<g transform="translate(90,66)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-6 1 L0 -5 L6 1"/><path d="M-4 0 L-4 6 L4 6 L4 0"/>
</g>
<text x="120" y="60" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#7f9bc4" letter-spacing="1">DISASSEMBLY · MS 50.4</text>
<text x="120" y="80" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Step 1 of 5</text>

<!-- Title -->
<text x="72" y="130" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Open the housing</text>

<!-- Task row 1 — DONE: green circle + white check (clickable) -->
<circle cx="90" cy="180" r="18" fill="#1d9e75"/>
<polyline points="82,180 88,186 99,174" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="177" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Remove the 4 lid screws</text>
<text x="122" y="196" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#aac4e6">Allen key · M3 · keep them aside</text>

<!-- Task row 2 — PENDING: red circle + action glyph (clickable) -->
<circle cx="90" cy="248" r="18" fill="#e24b4a"/>
<g transform="translate(90,248)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<line x1="0" y1="7" x2="0" y2="-7"/>
<polyline points="-6,-1 0,-7 6,-1"/>
</g>
<text x="122" y="245" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Lift off the top cover</text>
<text x="122" y="264" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#aac4e6">Locating lip disengages · exposes the PCB</text>

<!-- Hint -->
<text x="72" y="300" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#6f86a8">Tap the icon when a task is done — both green unlock the next step</text>

<!-- How-to panel (loop badge; content = live step animation, vector stand-in here) -->
<rect x="388" y="150" width="244" height="200" rx="13" fill="#08152b" stroke="#21407a" stroke-width="1"/>
<text x="404" y="174" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#7f9bc4" letter-spacing="0.5">HOW TO · this step</text>
<rect x="566" y="160" width="52" height="20" rx="10" fill="#13366b" stroke="#2e5aa0" stroke-width="1"/>
<text x="592" y="174" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#aac4e6" text-anchor="middle">loop</text>
<g transform="translate(510,262)">
<rect x="-70" y="-64" width="140" height="30" rx="6" fill="#3c434d" stroke="#555e6a" stroke-width="1.2"/>
<g stroke="#35d0a0" stroke-width="1.6" fill="none" stroke-linecap="round">
<path d="M -80 -46 L -80 -60"/><path d="M -84 -56 L -80 -60 L -76 -56"/>
</g>
<rect x="-62" y="-20" width="124" height="26" rx="3" fill="#1f5c33" stroke="#2f7a46" stroke-width="1.2"/>
<rect x="-70" y="16" width="140" height="38" rx="6" fill="#454c56" stroke="#5a636f" stroke-width="1.2"/>
</g>
<text x="510" y="338" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#6f86a8" text-anchor="middle">screws back out · lid lifts · loops</text>

<!-- Back (enabled, secondary) -->
<rect x="72" y="370" width="150" height="52" rx="13" fill="#1a2740" stroke="#324a6d" stroke-width="1.5"/>
<text x="147" y="402" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d1" text-anchor="middle">‹ Back</text>

<!-- Confirm & next — LOCKED (grey) until both tasks are green -->
<rect x="234" y="370" width="398" height="52" rx="13" fill="#1a2740" stroke="#324a6d" stroke-width="1.5"/>
<text x="420" y="402" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#5d7396" text-anchor="middle">Confirm &amp; next</text>
<polyline points="504,388 512,396 504,404" fill="none" stroke="#5d7396" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Grabber bar -->
<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1"/>
<rect x="318" y="471" width="44" height="4" rx="2" fill="#6b7686"/>
</svg>
