<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Compliance &amp; Safety — declared conformity and SVHC content from the Bosch DoC</title>
<desc>The Compliance and Safety detail page in the Usage Profile style. The left column is a pinch-scrollable card of declaration notes covering assessment conditions, EMC after installation, instructions and disposal. The right column stacks six declared values: CE conformity to the EMC directive, testing to ECE R10 revision 6, RoHS not applicable, two REACH SVHCs declared, and the CAS numbers for lead and lead monoxide. An inset shows the renamed landing tile with two chips.</desc>
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>
<circle cx="62" cy="64" r="21.5" fill="#2e5aa0"/><circle cx="62" cy="64" r="20" fill="#13366b"/>
<g stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M65 58 L58 64 L65 70"/><path d="M58 64 L70 64"/></g>
<text x="96" y="71" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold">Compliance &amp; Safety</text>
<rect x="44" y="96" width="592" height="1" fill="#1a335f"/>
<rect x="43" y="107" width="292" height="332" rx="13" fill="#21407a"/><rect x="44" y="108" width="290" height="330" rx="13" fill="#0e2950"/>
<text x="58" y="126" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">DECLARATION NOTES</text>
<text x="320" y="126" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.6" fill="#6f86a8" text-anchor="end">Bosch DoC · 09 Oct 2020</text>
<clipPath id="notes"><rect x="58" y="134" width="262" height="294"/></clipPath>
<g clip-path="url(#notes)"><text x="58" y="145" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.8" fill="#5dcaa5" font-weight="bold">ASSESSMENT</text><text x="58" y="159" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">The product may only be assessed with</text><text x="58" y="173" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">regard to its electrical, mechanical and</text><text x="58" y="187" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">functional safety, and to environmental</text><text x="58" y="201" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">effects (foreign bodies, temperature,</text><text x="58" y="215" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">humidity), after it has been installed in</text><text x="58" y="229" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">the product intended for the final user.</text><text x="58" y="257" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.8" fill="#5dcaa5" font-weight="bold">EMC AFTER INSTALLATION</text><text x="58" y="271" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">Once installed, the EMC properties may</text><text x="58" y="285" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">change. The final product (apparatus,</text><text x="58" y="299" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">machine, installation) must be inspected</text><text x="58" y="313" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">for EMC by its own manufacturer.</text><text x="58" y="341" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.8" fill="#5dcaa5" font-weight="bold">INSTRUCTIONS</text><text x="58" y="355" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">Assembly, installation and safety</text><text x="58" y="369" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">instructions per the manual must be</text><text x="58" y="383" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">followed.</text><text x="58" y="411" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.8" fill="#5dcaa5" font-weight="bold">DISPOSAL</text><text x="58" y="425" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.2" fill="#9fb3d1">Sort hardware, accessories and</text></g>
<text x="346" y="122" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">CE CONFORMITY</text>
<text x="491" y="144" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2014/30/EU (EMC)</text>
<line x1="346" y1="159" x2="636" y2="159" stroke="#12294e" stroke-width="1"/>
<text x="346" y="179" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">TESTED TO</text>
<text x="491" y="201" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">ECE R10 · rev.6 : 2019</text>
<line x1="346" y1="216" x2="636" y2="216" stroke="#12294e" stroke-width="1"/>
<text x="346" y="236" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">ROHS 2011/65/EU</text>
<text x="491" y="258" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#9fb3d1" font-weight="bold" text-anchor="middle">not applicable</text>
<line x1="346" y1="273" x2="636" y2="273" stroke="#12294e" stroke-width="1"/>
<text x="346" y="293" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">REACH SVHC</text>
<text x="491" y="315" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2 declared</text>
<line x1="346" y1="330" x2="636" y2="330" stroke="#12294e" stroke-width="1"/>
<text x="346" y="350" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">LEAD</text>
<text x="491" y="372" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">CAS 7439-92-1</text>
<line x1="346" y1="387" x2="636" y2="387" stroke="#12294e" stroke-width="1"/>
<text x="346" y="407" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">LEAD MONOXIDE</text>
<text x="491" y="429" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">CAS 1317-36-8</text>
<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1.5"/>
<line x1="305" y1="473" x2="375" y2="473" stroke="#6b7686" stroke-width="3" stroke-linecap="round"/>
<text x="20" y="14" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">Compliance &amp; Safety — "+" page. Left: pinch-scrollable declaration notes (manual pp. 132–134). Right: six declared values, Usage Profile family.</text>
<text x="20" y="508" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#5dcaa5" font-weight="bold">TILE FACE ON THE LANDING</text>
<rect x="19" y="517" width="292" height="74" rx="13" fill="#21407a"/><rect x="20" y="518" width="290" height="72" rx="13" fill="#0e2950"/>
<g stroke="#7fd3b6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M46 545 L55 548 L55 557 C55 561, 50 564, 46 566 C42 564, 37 561, 37 557 L37 548 Z"/></g>
<text x="68" y="541" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Compliance &amp; Safety</text>
<rect x="68" y="559" width="70" height="20" rx="10" fill="#13366b"/><text x="103.0" y="573" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#dbe4f0" text-anchor="middle">CE (EMC)</text>
<rect x="144" y="559" width="104" height="20" rx="10" fill="#13366b"/><text x="196.0" y="573" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#dbe4f0" text-anchor="middle">2 SVHC declared</text>
<circle cx="280" cy="554" r="21.5" fill="#2e5aa0"/><circle cx="280" cy="554" r="20" fill="#13366b"/><g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"><line x1="272" y1="554" x2="288" y2="554"/><line x1="280" y1="546" x2="280" y2="562"/></g>
<text x="330" y="528" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e24b4a" font-weight="bold">ROHS BADGE WAS WRONG</text>
<text x="330" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">the signed DoC leaves RoHS UNCHECKED — means of transport are outside 2011/65/EU. compliance.rohs flips true → not_applicable. Only EMC (2014/30/EU) is declared; the CE claim is scoped to it.</text>
<text x="330" y="546" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5dcaa5" font-weight="bold">THE SVHC GAP CLOSES</text>
<text x="330" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">Lead + Lead monoxide (REACH Art. 33, > 0.1 % w/w) populate substances_of_concern with basis DECLARED — the Table 6 #5/#6 attributes render again, on this tab. Coexists with the lead-free SAC305 solder in the BOM.</text>
<text x="330" y="564" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7f9bc4" font-weight="bold">STYLE</text>
<text x="330" y="578" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">Usage Profile family verbatim: one scrollable card left (chrome = touchable), six title-left / value-centred groups right, hairlines, no basis captions. The value 'not applicable' renders in secondary grey, not white.</text>
<text x="330" y="582" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e2a44a" font-weight="bold">SMALL PRINT</text>
<text x="330" y="596" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">the DoC (2020) names type F02U.V02.965-01; the 2026 datasheet order no. is -02 (our payload). Recorded in the spec, payload unchanged. Manual citation: VCU MS 50.4P Operation Manual pp. 132–134.</text>
</svg>
