<circle cx="490.0" cy="660" r="9" fill="#0a1f44"/>
<text x="490.0" y="686" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#0a1f44" font-weight="bold" text-anchor="middle">user</text>
<text x="24" y="664" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#33445e">At 0.75 m the outer edges sit at ±33°; a FLAT 980 panel there is foreshortened to cos 33° = 0.84 of its width.</text>
<text x="24" y="681" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#33445e">Yawing each canvas to face the eye removes that compression entirely — the readability gain, not a stylistic one.</text>
<text x="24" y="698" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#33445e">Three canvases replace one canvas with a transparent hole: simpler raycasting, and nothing can bleed through the stage.</text>
<text x="24" y="715" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#33445e">The stage is 100 mm left of the assembly centre, so the model sits ~8° off the forward axis. Imperceptible.</text>
<text x="24" y="732" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#33445e">Distance is the trade: 0.60 m gives ±39° (head turns), 0.88 m gives ±29° (comfortable, smaller text). 0.75 m is the middle.</text>
</svg>