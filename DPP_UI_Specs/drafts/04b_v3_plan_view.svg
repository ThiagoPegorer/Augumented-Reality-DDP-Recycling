<text x="24" y="56" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">three canvases on one rig · each yawed to face the eye · assembly centred on the forward axis</text>
