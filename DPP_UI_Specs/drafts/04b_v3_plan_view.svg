<path d="M318.5 283.4 L558.5 283.4 L588.5 570.0 L288.5 570.0 Z" fill="#f08a3c" opacity="0.10"/>
<path d="M318.5 283.4 L558.5 283.4 L588.5 570.0 L288.5 570.0 Z" fill="none" stroke="#f08a3c" stroke-width="1" stroke-dasharray="5 5"/>
