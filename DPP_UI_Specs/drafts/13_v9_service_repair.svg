<text x="482.6" y="534" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">and the passport must say so. New basis value "simulated" added to BASIS_VALUES / DppBasis, used on service.software_update_basis</text>
<text x="330" y="550" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">and repair_history.basis. IsFirmSource() excludes it, so the dots render dim, not firm — the same treatment as "modelled".</text>
<text x="330" y="568" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#e2a44a" font-weight="bold">WHAT THE FACE LOSES</text>
<text x="469.4" y="568" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">rows 4/5 currently read "disassembly guide in this app" and "spare parts — not provided" (Table 6 #12/#15). The totals replace them;</text>
<text x="330" y="584" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">those two lines move to this detail page. Say if you would rather keep one of them and drop a total.</text>
<text x="330" y="602" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#7f9bc4" font-weight="bold">DATES</text>
