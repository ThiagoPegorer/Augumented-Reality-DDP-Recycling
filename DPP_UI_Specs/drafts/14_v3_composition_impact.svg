<svg width="100%" viewBox="0 0 1080 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Composition &amp; Impact v3 — three drill-down blocks: composition, life-cycle stages, recovery rates</title>
<desc>Navy 640x430 panel beside the transparent action zone. Three tappable blocks replace the old LCA modal: a full-width materials and composition bar that opens a per-component view, a life-cycle S1 to S4 column chart that opens the openLCA process inputs and outputs, and a recovery-rate block showing the three impact categories EF 3.1 screening selected as most relevant. The circularity indicator row is removed because those indices are carried by the three blocks. Timing has not started on this screen.</desc>

