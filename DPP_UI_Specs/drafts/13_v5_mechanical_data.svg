<rect x="44" y="280" width="290" height="72" rx="13" fill="#0e2950"/>
<g stroke="#7fd3b6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="70" cy="316" r="9"/><path d="M70 311 L70 316 L74 319"/>
</g>
<text x="92" y="303" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Usage &amp; repair history</text>
<circle cx="97" cy="320" r="3.5" fill="#6f86a8"/>
<text x="106" y="323.5" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">In service — not provided</text>
<circle cx="97" cy="336" r="3.5" fill="#6f86a8"/>
<text x="106" y="339.5" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">Repairs logged — none</text>
<polyline points="306,311 312,316 306,321" fill="none" stroke="#9fb3d1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

<!-- the slot the rename empties -->
<rect x="346" y="280" width="290" height="72" rx="13" fill="none" stroke="#e24b4a" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.75"/>
<text x="491" y="309" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#e24b4a" opacity="0.9">empty after the rename</text>
<text x="491" y="326" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1" opacity="0.9">nothing now speaks about substances</text>
<text x="491" y="341" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1" opacity="0.9">of concern — Table 6 #5 #6 #7 #16 #17</text>

<!-- bottom bar -->
<rect x="44" y="374" width="180" height="52" rx="13" fill="#1a2740" stroke="#324a6d" stroke-width="2"/>
<text x="134" y="406" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#9fb3d1">Home</text>
