<svg width="100%" viewBox="0 0 680 610" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DPP Canva v5 — Substances &amp; safety becomes a full-width Mechanical data row</title>
<desc>The first tile is renamed Mechanical data and becomes a full-width 592 by 72 band carrying the spec chips that used to live in the identity hero, with a plus button at its right edge that opens an empty detail tab for the technical drawing. The remaining three tiles drop into a two-plus-one arrangement, leaving one slot empty because the rename removes the only tile that spoke about substances of concern.</desc>

<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- header -->
<text x="44" y="55" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7f9bc4">Digital Product Passport</text>
<rect x="44" y="68" width="592" height="1" fill="#1a335f"/>
<text x="44" y="98" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Bosch Motorsport | Vehicle Control Unit MS 50.4<tspan font-size="11" font-weight="normal" fill="#6f86a8"> - VCU0001</tspan></text>

<!-- ================= MECHANICAL DATA — full width 592 x 72 ================= -->
<rect x="43" y="119" width="594" height="74" rx="13" fill="#21407a"/>
<rect x="44" y="120" width="592" height="72" rx="13" fill="#0e2950"/>
<g stroke="#7fd3b6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M63 153 L70 149 L77 153 L70 157 Z"/>
  <path d="M63 153 L63 160"/><path d="M77 153 L77 160"/>
  <path d="M63 160 L70 164 L77 160"/><path d="M70 157 L70 164"/>
</g>
<text x="92" y="143" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Mechanical data</text>

<g font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#dbe4f0">
  <rect x="92"  y="156" width="117" height="20" rx="10" fill="#13366b"/><text x="150.5" y="170" text-anchor="middle">200 x 150 x 60 mm</text>
  <rect x="215" y="156" width="50"  height="20" rx="10" fill="#13366b"/><text x="240"   y="170" text-anchor="middle">660 g</text>
  <rect x="271" y="156" width="44"  height="20" rx="10" fill="#13366b"/><text x="293"   y="170" text-anchor="middle">IP67</text>
  <rect x="321" y="156" width="56"  height="20" rx="10" fill="#13366b"/><text x="349"   y="170" text-anchor="middle">5-18 V</text>
  <rect x="383" y="156" width="84"  height="20" rx="10" fill="#13366b"/><text x="425"   y="170" text-anchor="middle">-20 to 80 °C</text>
</g>

<!-- the "+" circle: THE ONLY hit target on this row. The card itself is not a button. -->
<circle cx="606" cy="156" r="21.5" fill="#2e5aa0"/>
<circle cx="606" cy="156" r="20" fill="#13366b"/>
<g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
  <line x1="598" y1="156" x2="614" y2="156"/>
  <line x1="606" y1="148" x2="606" y2="164"/>
</g>
<rect x="580" y="130" width="52" height="52" rx="26" fill="none" stroke="#5dcaa5" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
<text x="606" y="196" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9" fill="#5dcaa5" opacity="0.85">52 px hit</text>

<!-- ================= remaining tiles, 2 + 1 ================= -->
<rect x="43" y="199" width="292" height="74" rx="13" fill="#21407a"/>
<rect x="44" y="200" width="290" height="72" rx="13" fill="#0e2950"/>
<g stroke="#7fd3b6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M70 226 L79 229 L79 238 C79 242, 74 245, 70 247 C66 245, 61 242, 61 238 L61 229 Z"/>
</g>
<text x="92" y="223" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Compliance &amp; certification</text>
<g font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5">
  <rect x="92"  y="230" width="34" height="16" rx="8" fill="#0e2950" stroke="#1d9e75" stroke-width="1.2"/><text x="109" y="241" text-anchor="middle" fill="#5dcaa5">CE</text>
  <rect x="130" y="230" width="46" height="16" rx="8" fill="#0e2950" stroke="#1d9e75" stroke-width="1.2"/><text x="153" y="241" text-anchor="middle" fill="#5dcaa5">RoHS</text>
  <rect x="180" y="230" width="52" height="16" rx="8" fill="#0e2950" stroke="#6f86a8" stroke-width="1.2"/><text x="206" y="241" text-anchor="middle" fill="#6f86a8">REACH</text>
</g>
<circle cx="97" cy="256" r="3.5" fill="#6f86a8"/>
