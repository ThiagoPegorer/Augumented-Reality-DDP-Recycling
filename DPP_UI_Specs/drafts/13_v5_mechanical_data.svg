<polyline points="306,231 312,236 306,241" fill="none" stroke="#9fb3d1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="345" y="199" width="292" height="74" rx="13" fill="#21407a"/>
<rect x="346" y="200" width="290" height="72" rx="13" fill="#0e2950"/>
