  <path d="M364.5 243 L372.5 235"/>
  <path d="M375.5 232 a5.5 5.5 0 1 0 -0.2 -0.2"/>
</g>
<text x="394" y="223" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Service &amp; repair</text>
<circle cx="399" cy="240" r="3.5" fill="#6f86a8"/>
<text x="408" y="243.5" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">Spare parts — not provided</text>
<circle cx="399" cy="256" r="3.5" fill="#6f86a8"/>
<text x="408" y="259.5" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">Disassembly guide — in app</text>
<polyline points="608,231 614,236 608,241" fill="none" stroke="#9fb3d1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

