<!-- ===================== NOTES ===================== -->
<text x="20" y="14" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">DPP Canva v5 rev B · Mechanical data 592 x 72 @ y 100 · card NOT tappable, only the 40 px circle (52 px hit rect) @ c(562, 36) · Compliance + Service @ y 180 · Usage @ y 260 · bottom bar unchanged @ y 354</text>

<text x="20" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#5dcaa5">CHIPS ARE BOUND, NOT TYPED</text>
<text x="196" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">the existing specChipRoots pool + PassportView.FillChips move here — this un-orphans the values v4 dropped, with no new code</text>
<text x="20" y="522" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">FillChips emits every non-null specification in a fixed order, so you get FIVE chips, not three. Filtering to your three is one line — say so and I will.</text>

<text x="20" y="546" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#e2a44a">TEXT CHANGED FROM YOUR BRIEF</text>
<text x="216" y="546" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">"≤ 660 g" → "660 g".  U+2264 is NOT in either SF Pro SDF atlas (checked: 244 glyphs, ≤ and U+2212 both absent) — it</text>
<text x="216" y="562" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">would render as a fallback box. "≤" would also be wrong: 660 g is the declared mass, not an upper bound. "°" IS in the atlas, so °C is safe.</text>
<text x="216" y="578" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">Dimensions render 200 x 150 x 60 mm from the payload, per your answer. specifications.protection_class edited: "IP67 (representative)" → "IP67".</text>

<text x="20" y="602" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#e24b4a">NEW SPRITES</text>
<text x="108" y="602" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">IcCube (isometric box, replaces the warning triangle) and IcPlus. The card loses MakeTappable and its hover outline — the circle carries both.</text>
</svg>
