<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Usage Profile rev E — 6 x 2 grid, full-height year list</title>
<desc>The Usage Profile detail page as a six-by-two grid. The kilometres-per-year list fills the entire left column as the only card, showing twelve of sixteen rows with pinch-scroll for the rest. The right column stacks six plain stat rows — total distance with a thin teal bar, operating hours, own energy use, car energy use, average speed and daily use — each with its title on the left and its value centred, separated by hairlines.</desc>
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>
<circle cx="62" cy="64" r="21.5" fill="#2e5aa0"/><circle cx="62" cy="64" r="20" fill="#13366b"/>
<g stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M65 58 L58 64 L65 70"/><path d="M58 64 L70 64"/></g>
<text x="96" y="71" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold">Usage Profile</text>
<rect x="44" y="96" width="592" height="1" fill="#1a335f"/>
<rect x="43" y="107" width="292" height="332" rx="13" fill="#21407a"/><rect x="44" y="108" width="290" height="330" rx="13" fill="#0e2950"/>
<text x="58" y="128" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5dcaa5" font-weight="bold">KM DRIVEN PER YEAR</text>
<text x="320" y="128" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.6" fill="#6f86a8" text-anchor="end">Apr 2011 – Mar 2026</text>
