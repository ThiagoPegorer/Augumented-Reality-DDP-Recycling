<text x="84" y="364" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold">3 fault events logged over the use phase</text>
<text x="84" y="380" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10" fill="#6f86a8">most recent: intermittent SENS-B signal, Apr 2026 → repaired 14 May 2026 (see Service &amp; repair)</text>
<text x="614" y="364" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10" fill="#e2a44a" text-anchor="end">simulated</text>
<text x="44" y="428" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="8.8" fill="#6f86a8">profile values are the S4 exchanges or their documented sources — MiD 2017 · Bosch MS 5.0 manual (family proxy) · Apostolaki-Iosifidou et al. 2017 · 9 W × 5,625 h ÷ 0.765 = 66.2 kWh ✓</text>
