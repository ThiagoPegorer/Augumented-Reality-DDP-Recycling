<circle cx="280" cy="554" r="21.5" fill="#2e5aa0"/><circle cx="280" cy="554" r="20" fill="#13366b"/><g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"><line x1="272" y1="554" x2="288" y2="554"/><line x1="280" y1="546" x2="280" y2="562"/></g>
<text x="330" y="528" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5dcaa5" font-weight="bold">WHY EXACT DESIGN VALUES ARE NOW RIGHT</text>
<text x="330" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">this page shows the LCA's ASSUMED profile, not fake telemetry. Basis flips simulated → modelled; the 2011 in-service fiction and 226,500 km both die.</text>
<text x="330" y="546" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e24b4a" font-weight="bold">WHAT DIED WITH THE BOUNDARY</text>
<text x="330" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">the 2,590 kWh/y vehicle-consumption tile. S4 charges only the VCU's OWN draw (66.2 kWh total); vehicle energy is outside the FU — the exact error v3 made and v4 corrected 3.3x.</text>
<text x="330" y="564" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e2a44a" font-weight="bold">ONE SIMULATED ELEMENT REMAINS</text>
<text x="330" y="578" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">the fault line (with its Service &amp; repair cross-link) is telemetry, not S4 — it keeps its own amber tag while the profile tiles are modelled. Cut it if you want this page pure S4.</text>
<text x="330" y="582" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7f9bc4" font-weight="bold">DATA HOME</text>
<text x="330" y="596" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="9.3" fill="#9fb3d1">environmental.usage_profile gains avg_speed_kmh 40, operating_hours 5625, own_power_w 9, own_energy_kwh 66.2, charging_efficiency 0.765, daily_km 30, daily_minutes 45, grid "DE low voltage" (schema v0.11).</text>
