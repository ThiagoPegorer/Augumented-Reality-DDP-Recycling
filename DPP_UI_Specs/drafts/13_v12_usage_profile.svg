<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Usage Profile — the LCA use-phase model (S4) as a passport page</title>
<desc>The Usage Profile detail page: two hero counters for fifteen years of service and 225,000 km, six tiles carrying the S4 use-phase parameters — own energy use of 66.2 kWh, 15,000 km per year, 40 km/h average speed, 5,625 operating hours, 9 W own power draw and roughly 30 km of daily use — plus one amber-tagged simulated fault line that links to the repair in Service and repair. An inset shows the landing tile with two chips and the plus circle.</desc>
