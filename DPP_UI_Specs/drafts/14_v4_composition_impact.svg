<svg width="100%" viewBox="0 0 1080 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Composition &amp; Impact v4 — material shares, climate scenario ladder, recovery rates. All figures from BOM_v4 and impact_EF31.csv</title>
<desc>Navy 640x430 panel beside the transparent action zone. Block one: composition by MATERIAL derived from the component breakdowns, matching BOM_v4's By_Material sheet. Block two: the four end-of-life scenarios as climate bars where the teal cap is the avoided emission, showing that climate barely moves. Block three: reduction rates for the three EF 3.1 screening categories, stacked so each scenario's extra gain is visible, showing that minerals move a lot. Together the two blocks carry the finding that the AR-DPP is primarily a critical-raw-materials instrument.</desc>

<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

