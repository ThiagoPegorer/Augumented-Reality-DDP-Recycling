<title>RB2.1 — 04 DPP Canva v2: centred header, role-specific back affordance</title>
<desc>Two variants of the DPP Canva. The recycler panel has no header arrow and a Back button bottom left with Continue to disassembly on the right. The product user panel keeps the header arrow back to the stakeholder screen and shows Home bottom left with Scan next product on the right. Both share a centred Digital Product Passport headline and the same two by two tab grid.</desc>
