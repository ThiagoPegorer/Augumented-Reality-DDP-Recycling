<text x="128" y="243" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Lift off the top cover</text>
<text x="128" y="263" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb3d1">Exposes the main PCB</text>
