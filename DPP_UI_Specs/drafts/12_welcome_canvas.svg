<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ReBuilt v2.0 — Welcome canvas (OPEN APP)</title>
<desc>Navy 640x430 panel with the ReBuilt recycling mark, welcome title, subtitle and two buttons: Close app (secondary) and Continue to scan (primary teal). Grabber bar below the panel.</desc>

<!-- panel -->
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- brand mark: teal circle + recycling glyph (same glyph as 01_main_page, scaled 1.5) -->
<circle cx="340" cy="152" r="36" fill="#1d9e75"/>
<g transform="translate(340,152) scale(1.5)" fill="#ffffff">
  <g><path d="M -1.8 -9 L 1.8 -9 L 5.2 -3 L 8.4 -4.9 L 7 2 L 0.5 0.5 L 3.7 -1.3 L 0 -7.6 Z"/></g>
  <g transform="rotate(120)"><path d="M -1.8 -9 L 1.8 -9 L 5.2 -3 L 8.4 -4.9 L 7 2 L 0.5 0.5 L 3.7 -1.3 L 0 -7.6 Z"/></g>
  <g transform="rotate(240)"><path d="M -1.8 -9 L 1.8 -9 L 5.2 -3 L 8.4 -4.9 L 7 2 L 0.5 0.5 L 3.7 -1.3 L 0 -7.6 Z"/></g>
</g>

<!-- title + subtitle -->
<text x="340" y="236" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Welcome to ReBuilt</text>
<text x="340" y="266" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="14" fill="#9fb3d1">Digital Product Passport for guided dismantling</text>

<!-- secondary button: Close app -->
<rect x="44" y="370" width="180" height="52" rx="13" fill="#1a2740" stroke="#324a6d" stroke-width="2"/>
<text x="134" y="402" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="16" fill="#9fb3d1">Close app</text>

<!-- primary button: Continue to scan -->
<rect x="248" y="370" width="388" height="52" rx="13" fill="#1d9e75"/>
<text x="430" y="402" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Continue to scan</text>
<polyline points="596,388 604,396 596,404" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- grabber bar (00 §5) -->
<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1.5"/>
<line x1="305" y1="473" x2="375" y2="473" stroke="#6b7686" stroke-width="3" stroke-linecap="round"/>
</svg>
