<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DPP Canva v3 — APPROVED: arrow removed, slim header, Home / Continue bottom bar</title>
<desc>The DPP Canva landing page after three deletions and one addition. The circular back arrow at top left is gone, replaced by a labelled Home pill on the left of the bottom bar with Continue as the wide teal primary on the right. The 19 pt Vehicle Control Unit title is deleted and Digital Product Passport keeps its caption styling but moves left to x 24. The two-line dot legend is deleted. Everything between the rule and the button row shifts up 28 px, which is the space reclaimed for the tab remodel.</desc>

