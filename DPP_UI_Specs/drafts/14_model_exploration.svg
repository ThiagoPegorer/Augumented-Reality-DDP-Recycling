<svg width="100%" viewBox="0 0 1080 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ReBuilt v2.0 — Digital Model Exploration (LCA main panel + exploded action zone, moved out of the step flow)</title>
<desc>Left: navy 640x430 panel showing the life cycle analysis as the screen's main content, with a back arrow to the DPP Canva and a Continue CTA. Right: the transparent 340x300 action zone floating beside it, showing the exploded 3D VCU with its grab circle and gesture status column. The timer has not started on this screen.</desc>

