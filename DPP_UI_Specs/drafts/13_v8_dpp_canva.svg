<svg width="100%" viewBox="0 0 680 578" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DPP Canva v8 — prototype-aware Mechanical row, Electrical data tile, Compliance moved</title>
<desc>The DPP Canva landing page. A full-width Mechanical data row shows the measured size of the printed unit alongside the product declared IP rating, mass and temperature range, with a caption saying which is which, and a plus button at its right. Below it, Electrical data with the supply voltage chip and a count of the nine electrical parts, Service and repair, then Usage and repair history and Compliance and certification.</desc>
