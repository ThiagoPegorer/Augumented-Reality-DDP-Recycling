<text x="20" y="14" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">DPP Canva v8 · Mechanical 592x72 @ y100 (+ caption) · Electrical + Service @ y180 · Usage + Compliance @ y260 · both "+" circles are the only hit targets on their rows</text>
<text x="20" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#5dcaa5" font-weight="bold">SIZE</text>
<text x="60.4" y="506" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">200 x 150 x 60 mm restored — it was always the prototype's measurement. The product's declared 166 x 121 x 41 mm moves to the Mechanical "+" page with the technical drawing.</text>
<text x="20" y="524" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#e2a44a" font-weight="bold">THE CAPTION IS THE POINT</text>
<text x="192.39999999999998" y="524" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">one 10 pt line stops the row silently mixing a measured prop dimension with three declared product values. Without it a participant cannot tell which is which.</text>
<text x="20" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#7f9bc4" font-weight="bold">ELECTRICAL FACE</text>
<text x="133.0" y="542" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">5 to 18 V is the product's declared supply. "9 electrical parts" = 3 connectors + 2 processors + 1 CPU + 3 sensors, the objects actually in the box. The "+" shows them.</text>
<text x="20" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#e24b4a" font-weight="bold">GONE</text>
<text x="60.4" y="560" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#9fb3d1">198 pins was dropped — that is the Bosch connector pin count, not your printed connectors. Substances & safety still has no tile anywhere.</text>
</svg>
