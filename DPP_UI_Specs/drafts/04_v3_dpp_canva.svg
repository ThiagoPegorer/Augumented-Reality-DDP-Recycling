<text x="72" y="571" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="25" fill="#ffffff" font-weight="bold">Certificates &amp; safety</text>
<rect x="44" y="600" width="592" height="1" fill="#1a2740"/>
<rect x="44" y="618" width="86" height="24" rx="12.0" fill="#13366b"/><text x="87.0" y="634.8" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#5dcaa5" text-anchor="middle">CE</text>
<text x="144" y="634" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Conformity marking</text>
<text x="144" y="652" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">Declared under 2014/30/EU (EMC) on 09 Oct 2020 · tested to ECE R10 rev.6.</text>
<text x="144" y="668" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#6f86a8">Assessment is only valid once the unit is installed in its final product.</text>
<rect x="44" y="682" width="86" height="24" rx="12.0" fill="#13366b"/><text x="87.0" y="698.8" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#e24b4a" text-anchor="middle">REACH</text>
<text x="144" y="698" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Chemicals regulation</text>
<text x="144" y="716" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">2 substances of very high concern declared above 0.1 % w/w:</text>
<text x="144" y="732" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#6f86a8">lead (CAS 7439-92-1) and lead monoxide (CAS 1317-36-8).</text>
<rect x="44" y="746" width="86" height="24" rx="12.0" fill="#13366b"/><text x="87.0" y="762.8" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#5dcaa5" text-anchor="middle">WEEE 5</text>
<text x="144" y="762" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Waste electricals category</text>
<text x="144" y="780" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">Category 5, small equipment · selective treatment recommended at end of life.</text>
<text x="144" y="796" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#6f86a8">Do not dispose of this device in household waste.</text>
<rect x="44" y="810" width="86" height="24" rx="12.0" fill="#13366b"/><text x="87.0" y="826.8" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#5dcaa5" text-anchor="middle">IP67</text>
<text x="144" y="826" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Ingress protection</text>
<text x="144" y="844" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3d1">Dust tight, and protected against temporary immersion in water.</text>
<text x="144" y="860" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#6f86a8">Declared for the product; the printed demonstrator is not sealed.</text>
<rect x="248" y="874" width="388" height="52" rx="26" fill="#1d9e75"/>
<text x="442" y="906" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">Close</text>
<text x="20" y="992" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">Header: title left at the 24 margin, vertically centred in the 76 px band · badge right, same band</text>
<text x="20" y="1009" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">Badge is a BUTTON (hit area 50 px, visual 30) and opens the modal below · IP67 moved here out of tab 1</text>
<text x="20" y="1026" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">WARNING: red on the badge is not one of the three sanctioned meanings in 00 s.2.1 - the standard needs a</text>
<text x="20" y="1043" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">fourth meaning (regulatory marking) written into it, or the badge uses gold/highlight instead</text>
<text x="20" y="1060" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#33445e">Product user variant: header arrow present (shifts the title to x 94), bottom-left reads Home</text>
