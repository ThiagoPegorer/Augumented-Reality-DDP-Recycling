<svg width="100%" viewBox="0 0 680 1080" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RB2.1 — 04 DPP Canva v3: left headline, compliance badge button + certificates modal</title>
<desc>The DPP Canva with a left aligned Digital Product Passport headline vertically centred in the header, and a tappable compliance badge outlined in red on the right reading CE, REACH, WEEE 5 and IP67. The Product specifications tab now carries the product name as its headline. Below, the certificates and safety modal that the badge opens, explaining each acronym in plain language.</desc>
