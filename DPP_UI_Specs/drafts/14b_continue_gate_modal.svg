<svg width="100%" viewBox="0 0 500 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ReBuilt v2.0 — CONTINUE TO DISASSEMBLY? gate modal</title>
<desc>440x210 modal card matching the first-run prompt chrome. Title asks whether to continue to disassembly. Two buttons: Quit, which exits the product session back to the Welcome canvas, and Continue, which opens the disassembly intro. Grabber bar below.</desc>

<!-- card: stroke behind fill, same technique as the first-run modal -->
<rect x="30" y="30" width="440" height="210" rx="20" fill="#2e5aa0"/>
<rect x="32" y="32" width="436" height="206" rx="19" fill="#0d2a57"/>

<text x="250" y="82" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Continue to disassembly?</text>
<text x="250" y="108" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="13" fill="#9fb3d1">The guided 5-step dismantling comes next.</text>
<text x="250" y="126" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="13" fill="#9fb3d1">Timing starts when you press Start disassembly.</text>

<!-- secondary: Quit (renamed from Back — this edge leaves the product session) -->
<rect x="54" y="160" width="190" height="52" rx="13" fill="#1a2740" stroke="#324a6d" stroke-width="2"/>
<text x="149" y="192" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d1">Quit</text>

<!-- primary: Continue -->
<rect x="264" y="160" width="190" height="52" rx="13" fill="#1d9e75"/>
<text x="352" y="192" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Continue</text>
<polyline points="424,178 432,186 424,194" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- routing annotations (not part of the UI) -->
<text x="149" y="240" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">→ Welcome (exits the product)</text>
<text x="352" y="240" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f86a8">→ Disassembly intro</text>

<!-- grabber bar -->
<rect x="150" y="256" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1.5"/>
<line x1="215" y1="267" x2="285" y2="267" stroke="#6b7686" stroke-width="3" stroke-linecap="round"/>
</svg>
