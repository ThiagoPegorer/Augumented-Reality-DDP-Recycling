<svg width="100%" viewBox="0 0 680 668" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RB2.1 — 04 DPP Canva v1: 2x2 tab grid</title>
<desc>The rebuilt DPP Canva. A header carries a back button, the product name with its serial number and a compliance badge. Below the rule, four tabs in a two by two grid: Product specifications, Usage history, Environmental impact, and the new Training disassembly. Each tab shows headline values on its face and a plus button at its right. The bottom bar carries a red Close app button on the left and the primary Continue to disassembly button on the right.</desc>

<!-- ============ PANEL 640 x 430 (panel-local + 20) ============ -->
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- header: back button (panel-local x24, 40 visual / 52 hit) -->
<circle cx="64" cy="64" r="21.5" fill="#2e5aa0"/><circle cx="64" cy="64" r="20" fill="#13366b"/>
<g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M70 56 L60 64 L70 72"/><path d="M60 64 L74 64"/></g>

<!-- header: title + serial -->
<text x="96" y="58" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffffff">Vehicle Control Unit MS 50.4<tspan font-size="11" font-weight="normal" fill="#6f86a8"> - VCU0001</tspan></text>
<text x="96" y="76" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#7f9bc4">Digital Product Passport</text>

<!-- header: compliance badge (proposal, spec 04 section 6) -->
<rect x="470" y="44" width="166" height="26" rx="13" fill="#0e2950" stroke="#21407a"/>
<circle cx="486" cy="57" r="3.5" fill="#5dcaa5"/>
