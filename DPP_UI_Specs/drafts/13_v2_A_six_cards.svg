<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DPP Canva v2 — variant A: six Table 6 categories, each card carrying live preview data</title>
<desc>Navy 640x430 panel. Back arrow to Welcome. Six cards in a 2x3 grid, one per CIRPASS Table 6 information category: Identity and specs, Materials, Substances and safety, Compliance, Service and repair, Usage and circularity. Each card shows two lines of live data pulled from the passport; dim grey lines mark attributes that are not provided. A primary button continues to the 3D model.</desc>

<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- header -->
<circle cx="62" cy="64" r="20" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<g transform="translate(62,64)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 -6 L-4 0 L3 6"/><path d="M-4 0 L8 0"/></g>
<text x="96" y="58" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7f9bc4">Digital Product Passport</text>
<text x="96" y="78" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffffff">Vehicle Control Unit</text>
<text x="636" y="70" text-anchor="end" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#7f9bc4">scanned · vcu_001</text>
<line x1="44" y1="96" x2="636" y2="96" stroke="#1a335f" stroke-width="1"/>

<!-- ============ row 1 ============ -->
<!-- 1 Identity & specs -->
<rect x="44" y="108" width="290" height="82" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(72,149)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="0" cy="-4" r="4"/><path d="M-6 9 a6 7 0 0 1 12 0"/></g>
<text x="96" y="135" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Identity &amp; specs</text>
<text x="96" y="156" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb3d1">Bosch Motorsport · VCU MS 50.4</text>
<text x="96" y="172" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">200×150×60 mm · 660 g · IP67</text>
<polyline points="308,142 316,149 308,156" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- 2 Materials & composition -->
<rect x="346" y="108" width="290" height="82" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(374,149)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-5 -5 L5 -5 L5 5 L-5 5 Z"/><path d="M-2 -1 L2 -1 M-2 2 L2 2"/></g>
<text x="398" y="135" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Materials</text>
<!-- inline composition micro-bar: real masses, Al 55.0 / PCB 28.0 / brass 8.8 / steel 3.0 / Si 3.0 / misc 2.2 -->
<rect x="398" y="145" width="105" height="8" rx="2" fill="#2e5aa0"/>
<rect x="503" y="145" width="53"  height="8" rx="0" fill="#2e7d4f"/>
<rect x="556" y="145" width="17"  height="8" rx="0" fill="#f0c879"/>
<rect x="573" y="145" width="6"   height="8" rx="0" fill="#5d7396"/>
<rect x="579" y="145" width="6"   height="8" rx="0" fill="#5dcaa5"/>
<rect x="585" y="145" width="5"   height="8" rx="2" fill="#324a6d"/>
<text x="398" y="168" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">660 g · Al 55 % · PCB 28 % · brass 9 %</text>
<text x="398" y="182" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fe1cb">Au 63 · Ag 251 · Pd 28 mg</text>
<polyline points="610,142 618,149 610,156" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ============ row 2 ============ -->
<!-- 3 Substances & safety -->
<rect x="44" y="196" width="290" height="82" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(72,237)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 -8 L8 6 L-8 6 Z"/><path d="M0 -2 L0 1.5"/><path d="M0 4 L0 4.01"/></g>
<text x="96" y="223" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Substances &amp; safety</text>
<circle cx="101" cy="240" r="3.5" fill="#27c46c"/>
<text x="110" y="244" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">No battery · lead-free solder</text>
<circle cx="101" cy="256" r="3.5" fill="none" stroke="#6f86a8" stroke-width="1.4"/>
<text x="110" y="260" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f86a8">No substance declaration</text>
<polyline points="308,230 316,237 308,244" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- 4 Compliance & certification -->
<rect x="346" y="196" width="290" height="82" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(374,237)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-5 -6 L5 -6 L5 6 L-5 6 Z"/><path d="M-2 0 L0 2 L3 -3"/></g>
<text x="398" y="223" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Compliance</text>
<!-- tri-state badges: hollow = not provided -->
<rect x="398" y="232" width="40" height="17" rx="8.5" fill="none" stroke="#6f86a8" stroke-width="1"/>
<text x="418" y="244" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10" fill="#6f86a8">CE —</text>
<rect x="443" y="232" width="52" height="17" rx="8.5" fill="none" stroke="#6f86a8" stroke-width="1"/>
<text x="469" y="244" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10" fill="#6f86a8">RoHS —</text>
<rect x="500" y="232" width="58" height="17" rx="8.5" fill="none" stroke="#6f86a8" stroke-width="1"/>
<text x="529" y="244" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="10" fill="#6f86a8">REACH —</text>
<text x="398" y="266" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">WEEE cat. 5 · to verify</text>
<polyline points="610,230 618,237 610,244" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ============ row 3 ============ -->
<!-- 5 Service & repair -->
<rect x="44" y="284" width="290" height="82" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(72,325)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-7 6 L1 -2"/><path d="M2 -7 a5 5 0 1 0 5 5 L3 -3 Z"/></g>
<text x="96" y="311" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Service &amp; repair</text>
<circle cx="101" cy="328" r="3.5" fill="none" stroke="#6f86a8" stroke-width="1.4"/>
<text x="110" y="332" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f86a8">Spare parts not declared</text>
<circle cx="101" cy="344" r="3.5" fill="none" stroke="#6f86a8" stroke-width="1.4"/>
<text x="110" y="348" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f86a8">No repair history</text>
<polyline points="308,318 316,325 308,332" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- 6 Usage & circularity -->
<rect x="346" y="284" width="290" height="82" rx="13" fill="#0e2950" stroke="#21407a" stroke-width="1"/>
<g transform="translate(374,325)" fill="none" stroke="#7fd3b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-7 0 a7 7 0 1 1 3 5.7"/><path d="M-7 -4 L-7 0 L-3 0"/></g>
<text x="398" y="311" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Usage &amp; circularity</text>
<circle cx="403" cy="328" r="3.5" fill="#5dcaa5"/>
<text x="412" y="332" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9fb3d1">Design life 15 y · 225,000 km</text>
<circle cx="403" cy="344" r="3.5" fill="none" stroke="#6f86a8" stroke-width="1.4"/>
<text x="412" y="348" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f86a8">Circularity index not provided</text>
<polyline points="610,318 618,325 610,332" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- footer CTA -->
<text x="44" y="393" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f86a8">Filled dot = declared ·</text>
<text x="44" y="407" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f86a8">hollow = not provided</text>
<rect x="308" y="374" width="328" height="52" rx="13" fill="#1d9e75"/>
<text x="462" y="406" text-anchor="middle" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Continue to 3D model</text>
<polyline points="600,392 608,400 600,408" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1.5"/>
<line x1="305" y1="473" x2="375" y2="473" stroke="#6b7686" stroke-width="3" stroke-linecap="round"/>
</svg>
