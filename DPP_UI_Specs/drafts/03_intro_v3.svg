<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Disassembly intro v3.1 — unboxed job overview, two-column dismantling list, live 3D teardown preview</title>
<desc>Navy panel, Disassembly tab active. Left half: plain label-value rows (Tools, Est. time, Scope) and a two-column Dismantling list with teal bullets and bold white labels. Right half: live 3D exploded teardown preview. Teal start button at the bottom.</desc>
<rect width="680" height="520" fill="#000000"/>
<rect x="20" y="20" width="640" height="430" rx="22" fill="#0a1f44"/>

<!-- Header (unchanged, 02 v3 pattern, Disassembly active) -->
<circle cx="62" cy="64" r="20" fill="#13366b" stroke="#2e5aa0" stroke-width="1.5"/>
<g transform="translate(62,64)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-7 1 L0 -6 L7 1"/><path d="M-5 0 L-5 7 L5 7 L5 0"/>
</g>
<rect x="150" y="46" width="180" height="38" rx="19" fill="#324a6d"/>
<text x="240" y="70" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" fill="#c2cee0" text-anchor="middle">Informations</text>
<rect x="342" y="46" width="180" height="38" rx="19" fill="#0d2a57" stroke="#2e5aa0" stroke-width="1.5"/>
<text x="432" y="70" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Disassembly</text>
<line x1="44" y1="96" x2="636" y2="96" stroke="#1a335f" stroke-width="1"/>

<!-- Job overview — plain rows, no card boxes -->
<text x="44" y="126" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#7f9bc4">Job overview</text>

<text x="44" y="156" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8ba3c4">Tools</text>
<text x="132" y="156" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Allen key (hex 2.5 mm)</text>

<text x="44" y="184" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8ba3c4">Est. time</text>
<text x="132" y="184" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">~5 min</text>

<text x="44" y="212" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8ba3c4">Scope</text>
<text x="132" y="212" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5 steps</text>

<line x1="44" y1="232" x2="320" y2="232" stroke="#1a335f" stroke-width="1"/>

<!-- Dismantling — two columns of three, labels styled like the overview values -->
<text x="44" y="258" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="12.5" fill="#7f9bc4">Dismantling</text>

<circle cx="50" cy="284" r="3" fill="#1d9e75"/>
<text x="62" y="289" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">VCU case</text>
<circle cx="50" cy="306" r="3" fill="#1d9e75"/>
<text x="62" y="311" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PCB board</text>
<circle cx="50" cy="328" r="3" fill="#1d9e75"/>
<text x="62" y="333" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3 processors</text>

<circle cx="194" cy="284" r="3" fill="#1d9e75"/>
<text x="206" y="289" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3 chips</text>
<circle cx="194" cy="306" r="3" fill="#1d9e75"/>
<text x="206" y="311" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3 connectors</text>
<circle cx="194" cy="328" r="3" fill="#1d9e75"/>
<text x="206" y="333" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">14 screws</text>

<!-- Teardown preview (right half) — live 3D loop (vector stand-in for the RT) -->
<g transform="translate(498,215)">
<rect x="-95" y="-105" width="190" height="42" rx="8" fill="#3c434d" stroke="#555e6a" stroke-width="1.5"/>
<rect x="-85" y="-34" width="170" height="38" rx="4" fill="#1f5c33" stroke="#2f7a46" stroke-width="1.5"/>
<rect x="-70" y="-28" width="42" height="22" rx="2" fill="#c9a227"/>
<rect x="-18" y="-26" width="32" height="18" rx="2" fill="#1f4fa0"/>
<rect x="22" y="-28" width="12" height="22" rx="2" fill="#c0392b"/>
<rect x="40" y="-28" width="12" height="22" rx="2" fill="#c0392b"/>
<rect x="58" y="-28" width="12" height="22" rx="2" fill="#c0392b"/>
<rect x="-95" y="28" width="190" height="58" rx="8" fill="#454c56" stroke="#5a636f" stroke-width="1.5"/>
<circle cx="-112" cy="48" r="12" fill="#15181d" stroke="#2a3340" stroke-width="1.5"/>
<circle cx="-112" cy="76" r="12" fill="#15181d" stroke="#2a3340" stroke-width="1.5"/>
<circle cx="-134" cy="62" r="12" fill="#15181d" stroke="#2a3340" stroke-width="1.5"/>
</g>
<text x="488" y="366" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="11" fill="#6f86a8" text-anchor="middle">Teardown preview</text>

<!-- Start button -->
<rect x="44" y="388" width="592" height="48" rx="14" fill="#1d9e75"/>
<text x="330" y="418" font-family="-apple-system,'SF Pro Display','SF Pro Text',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Start disassembly</text>
<polyline points="420,406 428,414 420,422" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Grabber bar -->
<rect x="240" y="462" width="200" height="22" rx="11" fill="#0a0e16" stroke="#2a3344" stroke-width="1"/>
<rect x="318" y="471" width="44" height="4" rx="2" fill="#6b7686"/>
</svg>
