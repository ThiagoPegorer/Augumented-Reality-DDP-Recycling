<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="760" fill="#071630"/>
  <text x="24" y="34" fill="#eef4fb" font-size="19" font-weight="bold">04e — Certificates &amp; Security as DPP tab 3 (replaces Training disassembly) · mock v1 · 2026-08-08</text>
  <text x="24" y="54" fill="#5d7396" font-size="12">Data canvas 420×430 · all values from vcu_001.json (compliance / substances_of_concern / documents / certifications) — nothing invented</text>

  <!-- ================= RAIL CONTEXT ================= -->
  <text x="24" y="92" fill="#2EC4B6" font-size="13" font-weight="bold">RAIL — tab list after the change</text>
  <rect x="24" y="102" width="200" height="196" rx="10" fill="#0C2347" stroke="#21407a"/>
  <g font-size="12">
    <rect x="36" y="114" width="176" height="34" rx="8" fill="#0E2950"/>
    <text x="48" y="135" fill="#9fb0c9">Product specs</text><text x="192" y="135" fill="#27C46C" font-weight="bold">✓</text>
    <rect x="36" y="152" width="176" height="34" rx="8" fill="#0E2950"/>
    <text x="48" y="173" fill="#9fb0c9">Usage &amp; service</text><text x="192" y="173" fill="#27C46C" font-weight="bold">✓</text>
    <rect x="36" y="190" width="176" height="34" rx="8" fill="#0E2950"/>
    <text x="48" y="211" fill="#9fb0c9">Environmental impact</text><text x="192" y="211" fill="#27C46C" font-weight="bold">✓</text>
    <rect x="36" y="228" width="176" height="34" rx="8" fill="#16305c" stroke="#2EC4B6"/>
    <text x="48" y="249" fill="#ffffff" font-weight="bold">Certificates &amp; security</text>
  </g>
  <text x="36" y="286" fill="#5d7396" font-size="10.5">Training disassembly REMOVED — repetitive with the</text>
  <text x="36" y="298" fill="#5d7396" font-size="10.5" transform="translate(0,-1)">guided flow that follows. Visited ticks feed the gate →</text>

  <!-- ================= NOTES ================= -->
  <text x="24" y="336" fill="#2EC4B6" font-size="13" font-weight="bold">DECISIONS FOR APPROVAL</text>
  <g font-size="11.5" fill="#9fb0c9">
    <text x="24" y="358">1. Tab 3 = Certificates &amp; security, built into the data canvas</text>
    <text x="36" y="372">(same style as specs/usage/env); the RBv2_1/8 standalone</text>
    <text x="36" y="386">certificates screen retires after migration.</text>
    <text x="24" y="408">2. Gate: SuperPanelView tracks visited tabs (the rail ticks).</text>
    <text x="36" y="422">All 4 visited → "Continue to disassembly" turns green.</text>
    <text x="36" y="436">Pressing it grey = nothing happens + hint under the bar.</text>
    <text x="24" y="458">3. Role from the Stakeholder decision drives the bottom bar:</text>
    <text x="36" y="472">RECYCLER → gated "Continue to disassembly" (→ step flow).</text>
    <text x="36" y="486">PRODUCT USER → "Back to stakeholders" (→ decision page),</text>
    <text x="36" y="500">no gate — a product user never enters the teardown.</text>
    <text x="24" y="522">4. Mandatory-tab logic: the gate counts ALL FOUR tabs, so the</text>
    <text x="36" y="536">certificates tab is de-facto mandatory before disassembly.</text>
    <text x="24" y="558">5. "Certifications: none declared" is an HONEST EMPTY STATE</text>
    <text x="36" y="572">(payload certifications = []) — shown dim, not hidden.</text>
    <text x="24" y="594">6. Back (left) keeps its page-grammar role: previous tab.</text>
  </g>

  <!-- ================= MAIN PANEL — RECYCLER ================= -->
  <text x="290" y="92" fill="#2EC4B6" font-size="13" font-weight="bold">TAB 3 — CERTIFICATES &amp; SECURITY (recycler variant)</text>
  <rect x="290" y="102" width="520" height="540" rx="16" fill="#0A1E3F" stroke="#21407a" stroke-width="1.5"/>

  <!-- DoC card -->
  <rect x="314" y="122" width="472" height="108" rx="10" fill="#0E2950"/>
  <text x="330" y="144" fill="#2EC4B6" font-size="12" font-weight="bold">EU DECLARATION OF CONFORMITY</text>
  <rect x="676" y="132" width="96" height="20" rx="10" fill="#123a2b"/>
  <text x="724" y="146" fill="#27C46C" font-size="10.5" text-anchor="middle">available</text>
  <g font-size="12" fill="#eef4fb">
    <text x="330" y="168">CE — 2014/30/EU (EMC)</text>
    <text x="330" y="188">Tested to ECE R10 · rev.6 : 2019</text>
    <text x="330" y="208">Declared 2020-10-09 · Bosch Engineering GmbH</text>
  </g>
  <text x="330" y="224" fill="#5d7396" font-size="10">source: Operation Manual VCU MS 50.4P, pp. 132–133</text>

  <!-- Regulatory card -->
  <rect x="314" y="240" width="472" height="92" rx="10" fill="#0E2950"/>
  <text x="330" y="262" fill="#2EC4B6" font-size="12" font-weight="bold">REGULATORY STATUS</text>
  <g font-size="12">
    <text x="330" y="284" fill="#9fb0c9">REACH Art. 33</text>
    <text x="470" y="284" fill="#eef4fb">fulfilled — 2 SVHC declared:</text>
    <rect x="666" y="272" width="36" height="18" rx="9" fill="#3a3320"/><text x="684" y="285" fill="#f0c879" font-size="10.5" text-anchor="middle">Pb</text>
    <rect x="708" y="272" width="42" height="18" rx="9" fill="#3a3320"/><text x="729" y="285" fill="#f0c879" font-size="10.5" text-anchor="middle">PbO</text>
    <text x="330" y="306" fill="#9fb0c9">RoHS</text>
    <text x="470" y="306" fill="#eef4fb">not applicable — outside 2011/65/EU scope</text>
    <text x="330" y="324" fill="#9fb0c9">WEEE</text>
    <text x="470" y="324" fill="#eef4fb">Cat. 5 · small equipment</text>
  </g>

  <!-- Declaration notes card -->
  <rect x="314" y="342" width="472" height="128" rx="10" fill="#0E2950"/>
  <text x="330" y="364" fill="#2EC4B6" font-size="12" font-weight="bold">DECLARATION NOTES (from the DoC)</text>
  <g font-size="11">
    <rect x="330" y="374" width="218" height="40" rx="8" fill="#0a1a38"/>
    <text x="340" y="390" fill="#eef4fb" font-weight="bold">Assessment</text>
    <text x="340" y="404" fill="#9fb0c9">only after installation in the final product</text>
    <rect x="558" y="374" width="218" height="40" rx="8" fill="#0a1a38"/>
    <text x="568" y="390" fill="#eef4fb" font-weight="bold">EMC after installation</text>
    <text x="568" y="404" fill="#9fb0c9">final product must re-inspect EMC</text>
    <rect x="330" y="420" width="218" height="40" rx="8" fill="#0a1a38"/>
    <text x="340" y="436" fill="#eef4fb" font-weight="bold">Instructions</text>
    <text x="340" y="450" fill="#9fb0c9">assembly &amp; safety per the manual</text>
    <rect x="558" y="420" width="218" height="40" rx="8" fill="#0a1a38"/>
    <text x="568" y="436" fill="#eef4fb" font-weight="bold">Disposal</text>
    <text x="568" y="450" fill="#9fb0c9">sort for recycling · never household waste</text>
  </g>

  <!-- Certifications empty state -->
  <rect x="314" y="480" width="472" height="44" rx="10" fill="#0E2950" opacity="0.65"/>
  <text x="330" y="502" fill="#5d7396" font-size="12" font-weight="bold">CERTIFICATIONS</text>
  <text x="330" y="516" fill="#5d7396" font-size="11">none declared for this unit — stated, not hidden</text>

  <!-- bottom bar: two CTA states -->
  <rect x="314" y="548" width="110" height="36" rx="18" fill="#233a5c"/>
  <text x="369" y="571" fill="#9fb0c9" font-size="13" text-anchor="middle">Back</text>
  <rect x="520" y="548" width="256" height="36" rx="18" fill="#2b3a52" stroke="#3a4a63"/>
  <text x="640" y="571" fill="#7c8ba1" font-size="13" text-anchor="middle">🔒 Continue to disassembly</text>
  <text x="648" y="600" fill="#5d7396" font-size="10.5" text-anchor="middle">state A — locked: any tab not yet visited · hint: "visit all passport tabs first"</text>
  <rect x="520" y="608" width="256" height="36" rx="18" fill="#27C46C"/>
  <text x="648" y="631" fill="#08331c" font-size="13" font-weight="bold" text-anchor="middle">Continue to disassembly ➜</text>
  <text x="648" y="656" fill="#5d7396" font-size="10.5" text-anchor="middle">state B — all 4 tabs visited: green, routes into the guided step flow</text>

  <!-- ================= PRODUCT USER VARIANT ================= -->
  <text x="850" y="92" fill="#2EC4B6" font-size="13" font-weight="bold">PRODUCT USER — bottom bar only</text>
  <rect x="850" y="102" width="306" height="200" rx="16" fill="#0A1E3F" stroke="#21407a" stroke-width="1.5"/>
  <text x="866" y="128" fill="#9fb0c9" font-size="11.5">Same page content, different exit:</text>
  <rect x="866" y="144" width="90" height="32" rx="16" fill="#233a5c"/>
  <text x="911" y="165" fill="#9fb0c9" font-size="12" text-anchor="middle">Back</text>
  <rect x="1000" y="144" width="140" height="32" rx="16" fill="#16305c" stroke="#2EC4B6"/>
  <text x="1070" y="165" fill="#ffffff" font-size="11.5" text-anchor="middle" font-weight="bold">Back to stakeholders</text>
  <g font-size="10.5" fill="#5d7396">
    <text x="866" y="196">left Back = previous tab (page grammar unchanged)</text>
    <text x="866" y="212">right pill = returns to the STAKEHOLDER DECISION page;</text>
    <text x="866" y="228">no disassembly gate — a product user never enters the</text>
    <text x="866" y="244">teardown. No green state needed.</text>
    <text x="866" y="272">Open Q: keep it navy/teal as drawn, or green like the</text>
    <text x="866" y="288">recycler CTA? (navy/teal recommended — green means "go")</text>
  </g>

  <!-- build impact -->
  <text x="850" y="336" fill="#2EC4B6" font-size="13" font-weight="bold">BUILD IMPACT (for the code round)</text>
  <g font-size="11.5" fill="#9fb0c9">
    <text x="850" y="358">· RBv2_1_1/5 new phase: certificates page into the data</text>
    <text x="862" y="372">canvas + tabPages slot 3 (MERGE, trap 4 respected)</text>
    <text x="850" y="394">· SuperPanelView: visited-tab set + gated CTA + role switch</text>
    <text x="850" y="416">· TrainingPage retired from tabPages (object deleted in the</text>
    <text x="862" y="430">next cleanup pass — never orphaned active, trap 4)</text>
    <text x="850" y="452">· Verify rows: CertSecurityView.owner → RBv2_1_1/5</text>
    <text x="850" y="474">· step-text renames (parked) unaffected</text>
  </g>
</svg>
