  <text x="608" y="748" font-size="12" font-weight="700" fill="#dbe4f0">SOFTWARE</text>
  <text x="700" y="748" font-size="9" fill="#8ba3c7">(was "History") · model untinted · content kept</text>
  <g font-size="10">
    <text x="608" y="786" fill="#8ba3c7">Firmware</text><text x="988" y="786" fill="#dbe4f0" text-anchor="end">15 versions · v1.0 → v15.0</text>
    <text x="608" y="812" fill="#8ba3c7">Calibration map changes</text><text x="988" y="812" fill="#dbe4f0" text-anchor="end">6</text>
    <text x="608" y="838" fill="#8ba3c7">Sensor recalibrations</text><text x="988" y="838" fill="#dbe4f0" text-anchor="end">3</text>
