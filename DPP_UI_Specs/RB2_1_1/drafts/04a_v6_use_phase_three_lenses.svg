  <text x="80" y="748" font-size="12" font-weight="700" fill="#4da3ff">ELECTRICAL DATA</text>
  <text x="215" y="748" font-size="9" fill="#8ba3c7">model: connectors + flash IC (ic_1) + bus interface (ic_4) lit</text>
  <text x="80" y="776" font-size="9" letter-spacing="1" fill="#5d7396">ELECTRICAL</text>
  <g font-size="10">
    <text x="80" y="796" fill="#8ba3c7">Voltage transients</text><text x="520" y="796" fill="#dbe4f0" text-anchor="end">2,180 (ISO 7637-2)</text>
    <text x="80" y="818" fill="#8ba3c7">Undervoltage events</text><text x="520" y="818" fill="#dbe4f0" text-anchor="end">37 — cluster at the 12 V battery failures (2012, 2020)</text>
    <text x="80" y="840" fill="#8ba3c7">Load dumps</text><text x="520" y="840" fill="#dbe4f0" text-anchor="end">4</text>
  </g>
  <text x="80" y="872" font-size="9" letter-spacing="1" fill="#5d7396">DATA</text>
  <g font-size="10">
    <text x="80" y="892" fill="#8ba3c7">Flash write cycles</text><text x="520" y="892" fill="#dbe4f0" text-anchor="end">45,000 / 100,000 · 55 % left (hard limit)</text>
    <text x="80" y="914" fill="#8ba3c7">CPU above 80 % load</text><text x="520" y="914" fill="#dbe4f0" text-anchor="end">675 h</text>
    <text x="80" y="936" fill="#8ba3c7">ECC corrected · resets</text><text x="520" y="936" fill="#dbe4f0" text-anchor="end">118 · 9</text>
    <text x="80" y="958" fill="#8ba3c7">CAN</text><text x="520" y="958" fill="#dbe4f0" text-anchor="end">8,640 error frames · 6 bus-off</text>
    <text x="80" y="980" fill="#8ba3c7">Diagnostic codes</text><text x="520" y="980" fill="#dbe4f0" text-anchor="end">41 total · 1 active · 40 cleared</text>
  </g>

  <!-- SOFTWARE -->
