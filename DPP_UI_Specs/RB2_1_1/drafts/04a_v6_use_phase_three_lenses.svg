    <circle cx="1268" cy="312" r="4.5" fill="#6f86a8"/><text x="1278" y="316">consumable 8.0 g</text>
  </g>

  <!-- ΔT table -->
  <text x="908" y="344" font-size="9" letter-spacing="1" fill="#5d7396">ΔT BAND · CYCLES · DAMAGE — where the 48 % comes from (Coffin-Manson + Miner)</text>
  <g font-size="9.5" fill="#dbe4f0">
    <text x="908" y="364">below 20 °C</text><text x="1030" y="364">4,200</text><rect x="1090" y="356" width="27" height="8" rx="3" fill="#f08a3c" opacity="0.55"/><text x="1300" y="364" text-anchor="end">0.039</text>
    <text x="908" y="384">20–40 °C</text><text x="1030" y="384">4,600</text><rect x="1090" y="376" width="116" height="8" rx="3" fill="#f08a3c" opacity="0.75"/><text x="1300" y="384" text-anchor="end">0.173</text>
    <text x="908" y="404">40–60 °C</text><text x="1030" y="404">2,000</text><rect x="1090" y="396" width="140" height="8" rx="3" fill="#f08a3c"/><text x="1300" y="404" text-anchor="end">0.208</text>
    <text x="908" y="424">60–80 °C</text><text x="1030" y="424">420</text><rect x="1090" y="416" width="58" height="8" rx="3" fill="#f08a3c" opacity="0.65"/><text x="1300" y="424" text-anchor="end">0.086</text>
    <text x="908" y="444">above 80 °C</text><text x="1030" y="444">30</text><rect x="1090" y="436" width="7" height="8" rx="3" fill="#f08a3c" opacity="0.55"/><text x="1300" y="444" text-anchor="end">0.010</text>
  </g>
  <line x1="908" y1="456" x2="1300" y2="456" stroke="#1a335f"/>
  <text x="908" y="474" font-size="9.5" fill="#8ba3c7">Σ damage 0.516 → consumed 51.6 % · remaining 48 %</text>

  <!-- findings -->
  <rect x="908" y="490" width="504" height="24" rx="8" fill="#0a1a38"/>
  <text x="920" y="506" font-size="9.5" fill="#dbe4f0">Over-temperature</text>
  <text x="1080" y="506" font-size="9.5" fill="#8ba3c7">41 h above 80 °C limit · peak 94 °C</text>
  <rect x="908" y="518" width="504" height="24" rx="8" fill="#0a1a38"/>
  <text x="920" y="534" font-size="9.5" fill="#dbe4f0">Processor failure 2025-12</text>
  <text x="1080" y="534" font-size="9.5" fill="#8ba3c7">replaced at 220,260 km · heat implicated</text>

