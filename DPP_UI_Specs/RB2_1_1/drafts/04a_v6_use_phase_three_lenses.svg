  <text x="620" y="880" font-size="9.5" fill="#8ba3c7">13 diagnostic codes tie to logged service events — the unit</text>
  <text x="620" y="894" font-size="9.5" fill="#8ba3c7">raises codes for the whole vehicle, which is why the service</text>
  <text x="620" y="908" font-size="9.5" fill="#8ba3c7">log carries vehicle systems as well as its own faults (§4.6).</text>

  <!-- PART RECORD -->
  <rect x="1056" y="720" width="564" height="330" rx="18" fill="#0d2144" stroke="#2eb086" stroke-width="1.5"/>
  <text x="1076" y="748" font-size="12" font-weight="700" fill="#2eb086">PART RECORD — pinch a body on this tab (unchanged from v5)</text>
  <text x="1076" y="782" font-size="14" font-weight="700" fill="#dbe4f0">Connectors 3× AS018-35</text>
  <circle cx="1084" cy="804" r="5.5" fill="#f0c879"/>
  <text x="1096" y="808" font-size="10.5" fill="#f0c879">reuse after test</text>
  <text x="1220" y="808" font-size="10.5" fill="#8ba3c7">150.1 g</text>
  <rect x="1076" y="822" width="520" height="56" rx="10" fill="#0a1a38"/>
  <text x="1088" y="842" font-size="9.5" fill="#8ba3c7">One SENS-B reseat logged 2022 — contact resistance to be verified before</text>
  <text x="1088" y="856" font-size="9.5" fill="#8ba3c7">reuse. Verdicts follow the evidence on this screen, not a rule of thumb.</text>
  <rect x="1076" y="894" width="86" height="28" rx="14" fill="#10264a" stroke="#5d7396"/>
  <text x="1119" y="912" font-size="10" fill="#dbe4f0" text-anchor="middle">Back</text>
  <text x="1076" y="948" font-size="9" fill="#8ba3c7">selected part keeps true colour, the rest ghost (α 0.30) · Back returns to the</text>
  <text x="1076" y="962" font-size="9" fill="#8ba3c7">active lens · pinching another (ghosted) body switches the record directly</text>

  <!-- ================= decisions ================= -->
  <rect x="60" y="1080" width="1560" height="130" rx="18" fill="none" stroke="#f0c879" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="84" y="1110" font-size="13" font-weight="700" fill="#f0c879">DECISIONS BEFORE CODE (v6)</text>
  <text x="84" y="1136" font-size="11" fill="#dbe4f0">1 · Thermal Data's model tint = VERDICT colours (as drawn) — the reuse story is the headline and 0.767 reads as colour. Alternative: the heat ramp (ic_1 hottest). Pick one; the other dies.</text>
  <text x="84" y="1162" font-size="11" fill="#dbe4f0">2 · #f08a3c stays as a plain CHART colour for the damage bars only (like 04c's #1f77b4) — no new palette token, and it never appears on the model under decision 1.</text>
  <text x="84" y="1188" font-size="11" fill="#dbe4f0">3 · "No page titles on data-canvas tabs" becomes a general rule in 00 (04c already complies; the cert page keeps its title — it is a reference page, not a tab). basis:"simulated" moves to a footnote line.</text>
</svg>
