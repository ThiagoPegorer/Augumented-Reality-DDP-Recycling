    <g stroke="#2eb086" stroke-width="2.5"><line x1="496" y1="188" x2="496" y2="204"/><line x1="540" y1="182" x2="540" y2="198"/><line x1="600" y1="178" x2="600" y2="194"/><line x1="644" y1="184" x2="644" y2="200"/></g>
