  <!-- SOH + indicators -->
  <text x="908" y="198" font-size="9.5" letter-spacing="1.5" fill="#2eb086">STATE OF HEALTH — min of mechanisms</text>
  <text x="908" y="238" font-size="32" font-weight="700" fill="#dbe4f0">48 %</text>
  <text x="1010" y="216" font-size="10" fill="#8ba3c7">limiting: thermal fatigue</text>
  <text x="1010" y="234" font-size="9.5" fill="#dbe4f0">Flash endurance</text>
  <rect x="1140" y="226" width="160" height="8" rx="4" fill="#0a1a38"/><rect x="1140" y="226" width="88" height="8" rx="4" fill="#f0c879"/>
