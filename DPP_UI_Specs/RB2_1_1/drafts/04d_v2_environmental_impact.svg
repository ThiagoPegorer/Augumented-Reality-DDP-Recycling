<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1330" viewBox="0 0 1680 1330" font-family="'Segoe UI','SF Pro Display',Arial,sans-serif">
  <rect width="1680" height="1330" fill="#0a1526"/>

  <text x="60" y="50" font-size="21" font-weight="700" fill="#dbe4f0">04d · ENVIRONMENTAL IMPACT — v2 mock</text>
  <text x="60" y="76" font-size="13" fill="#8ba3c7">Round-2 corrections: stage descriptions on the explorer · per-stage grouped BY IMPACT (own unit each), S5 removed (Recycling owns it) · explanatory footers deleted · elevation kit + equidistant grids everywhere · 2026-08-09</text>

  <!-- ================= TAB 1: LCA EXPLORER ================= -->
  <rect x="60" y="100" width="780" height="560" rx="24" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <g font-size="9.5" text-anchor="middle">
    <rect x="88" y="122" width="88" height="30" rx="15" fill="#16305c" stroke="#2eb086" stroke-width="1.5"/>
    <text x="132" y="141" fill="#ffffff" font-weight="700">LCA explorer</text>
    <rect x="182" y="122" width="88" height="30" rx="15" fill="#0E2950" stroke="#21407a"/>
    <text x="226" y="141" fill="#8ba3c7">Main impacts</text>
    <rect x="276" y="122" width="88" height="30" rx="15" fill="#0E2950" stroke="#21407a"/>
    <text x="320" y="141" fill="#8ba3c7">Per stage</text>
    <rect x="370" y="122" width="88" height="30" rx="15" fill="#0E2950" stroke="#21407a"/>
    <text x="414" y="141" fill="#8ba3c7">Recycling</text>
  </g>
  <text x="88" y="172" font-size="8" fill="#5d7396">all pills + cards carry the 00 §4.1 kit: shadow, gloss, hover rise (drawn flat here, built with AddShadow/AddGloss/HoverHighlight)</text>

  <!-- ring, left -->
  <circle cx="250" cy="410" r="105" fill="none" stroke="#2e5aa0" stroke-width="13" stroke-dasharray="103 29" stroke-linecap="round" transform="rotate(-80 250 410)"/>
  <g font-size="10" fill="#dbe4f0" text-anchor="middle" font-weight="700">
    <text x="250" y="290">S1</text>
    <text x="358" y="368">S2</text>
    <text x="318" y="512">S3</text>
    <text x="182" y="512">S4</text>
    <text x="142" y="368">S5</text>
  </g>
  <text x="250" y="406" font-size="10" fill="#8ba3c7" text-anchor="middle">cradle → grave</text>
  <text x="250" y="422" font-size="8.5" fill="#5d7396" text-anchor="middle">EF 3.1 · openLCA · ecoinvent</text>

  <!-- descriptions, right — 5 equidistant rows (pitch 62) -->
  <g>
    <rect x="400" y="252" width="412" height="52" rx="12" fill="#0a1a38"/>
    <text x="414" y="272" font-size="10" font-weight="700" fill="#dbe4f0">S1 · Materials &amp; construction</text>
    <text x="414" y="288" font-size="8.5" fill="#8ba3c7">Raw-material extraction and part production — HPDC housings, PCB, ICs, connectors.</text>

    <rect x="400" y="314" width="412" height="52" rx="12" fill="#0a1a38"/>
    <text x="414" y="334" font-size="10" font-weight="700" fill="#dbe4f0">S2 · Hardware assembly</text>
    <text x="414" y="350" font-size="8.5" fill="#8ba3c7">Die-casting and SMT mounting — the process energy that turns parts into the unit.</text>

    <rect x="400" y="376" width="412" height="52" rx="12" fill="#0a1a38"/>
    <text x="414" y="396" font-size="10" font-weight="700" fill="#dbe4f0">S3 · Distribution</text>
    <text x="414" y="412" font-size="8.5" fill="#8ba3c7">Transport from production to vehicle integration.</text>

    <rect x="400" y="438" width="412" height="52" rx="12" fill="#0a1a38"/>
    <text x="414" y="458" font-size="10" font-weight="700" fill="#dbe4f0">S4 · Use phase</text>
    <text x="414" y="474" font-size="8.5" fill="#8ba3c7">15 years · 225,000 km of powered operation on the German grid.</text>

    <rect x="400" y="500" width="412" height="52" rx="12" fill="#0a1a38"/>
    <text x="414" y="520" font-size="10" font-weight="700" fill="#dbe4f0">S5 · End-of-life</text>
    <text x="414" y="536" font-size="8.5" fill="#8ba3c7">Collection and treatment — explored in depth on the Recycling tab.</text>
  </g>
  <text x="88" y="620" font-size="9" fill="#f0c879">footer text REMOVED (round 2) — the descriptions carry the explanation now</text>

  <!-- ================= TAB 2: MAIN IMPACTS ================= -->
  <rect x="880" y="100" width="740" height="560" rx="24" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <text x="908" y="132" font-size="12" font-weight="700" fill="#2eb086">MAIN IMPACTS — EF 3.1 screening pareto</text>

  <!-- 4 equidistant bar rows, pitch 118, filling the card -->
  <g font-size="10.5" fill="#dbe4f0">
    <text x="908" y="184">Resource use, minerals &amp; metals</text>
    <rect x="908" y="196" width="440" height="26" rx="7" fill="#2eb086"/>
    <text x="1360" y="214" font-weight="700">72.5 %</text>

    <text x="908" y="302">Climate change</text>
    <rect x="908" y="314" width="150" height="26" rx="7" fill="#1f77b4"/>
    <text x="1070" y="332" fill="#f0c879">[openLCA] %</text>

    <text x="908" y="420">Eutrophication, freshwater</text>
    <rect x="908" y="432" width="70" height="26" rx="7" fill="#4da3ff"/>
    <text x="990" y="450" fill="#f0c879">[openLCA] %</text>

    <text x="908" y="538" fill="#8ba3c7">Everything else</text>
    <rect x="908" y="550" width="40" height="26" rx="7" fill="#3a4a63"/>
    <text x="960" y="568" fill="#f0c879">[openLCA] %</text>
  </g>
  <text x="908" y="640" font-size="9" fill="#f0c879">footer text REMOVED (round 2) — the bars stand alone</text>

  <!-- ================= TAB 3: PER STAGE (BY IMPACT) ================= -->
  <rect x="60" y="700" width="1000" height="500" rx="24" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <text x="88" y="732" font-size="12" font-weight="700" fill="#1f77b4">PER STAGE — grouped BY IMPACT, each with its own unit and scale · S1–S4 only (S5 → Recycling)</text>
  <text x="88" y="750" font-size="9" fill="#f0c879">bar heights LAYOUT ONLY — real values from the openLCA contribution trees (one calculation per product system, script planned)</text>

  <!-- three equidistant panels, pitch 320 -->
  <!-- minerals -->
  <g>
    <text x="128" y="790" font-size="10.5" font-weight="700" fill="#2eb086">Minerals &amp; metals</text>
    <text x="128" y="804" font-size="8" fill="#5d7396">kg Sb eq</text>
    <line x1="120" y1="1080" x2="360" y2="1080" stroke="#1a335f" stroke-width="1.5"/>
    <rect x="140" y="850" width="36" height="230" fill="#2eb086"/>
    <rect x="196" y="1010" width="36" height="70" fill="#2eb086"/>
    <rect x="252" y="1060" width="36" height="20" fill="#2eb086"/>
    <rect x="308" y="1035" width="36" height="45" fill="#2eb086"/>
    <g font-size="9" fill="#dbe4f0" text-anchor="middle">
      <text x="158" y="1100">S1</text><text x="214" y="1100">S2</text><text x="270" y="1100">S3</text><text x="326" y="1100">S4</text>
    </g>
    <text x="240" y="940" font-size="26" fill="#f0c879" opacity="0.25" font-weight="700" text-anchor="middle">[openLCA]</text>
  </g>
  <!-- climate -->
  <g>
    <text x="448" y="790" font-size="10.5" font-weight="700" fill="#1f77b4">Climate change</text>
    <text x="448" y="804" font-size="8" fill="#5d7396">kg CO2 eq</text>
    <line x1="440" y1="1080" x2="680" y2="1080" stroke="#1a335f" stroke-width="1.5"/>
    <rect x="460" y="900" width="36" height="180" fill="#1f77b4"/>
    <rect x="516" y="970" width="36" height="110" fill="#1f77b4"/>
    <rect x="572" y="1050" width="36" height="30" fill="#1f77b4"/>
    <rect x="628" y="880" width="36" height="200" fill="#1f77b4"/>
    <g font-size="9" fill="#dbe4f0" text-anchor="middle">
      <text x="478" y="1100">S1</text><text x="534" y="1100">S2</text><text x="590" y="1100">S3</text><text x="646" y="1100">S4</text>
    </g>
    <text x="560" y="940" font-size="26" fill="#f0c879" opacity="0.25" font-weight="700" text-anchor="middle">[openLCA]</text>
  </g>
  <!-- eutrophication -->
  <g>
    <text x="768" y="790" font-size="10.5" font-weight="700" fill="#4da3ff">Eutrophication, freshwater</text>
    <text x="768" y="804" font-size="8" fill="#5d7396">kg P eq</text>
    <line x1="760" y1="1080" x2="1000" y2="1080" stroke="#1a335f" stroke-width="1.5"/>
    <rect x="780" y="870" width="36" height="210" fill="#4da3ff"/>
    <rect x="836" y="1000" width="36" height="80" fill="#4da3ff"/>
    <rect x="892" y="1062" width="36" height="18" fill="#4da3ff"/>
    <rect x="948" y="1020" width="36" height="60" fill="#4da3ff"/>
    <g font-size="9" fill="#dbe4f0" text-anchor="middle">
      <text x="798" y="1100">S1</text><text x="854" y="1100">S2</text><text x="910" y="1100">S3</text><text x="966" y="1100">S4</text>
    </g>
    <text x="880" y="940" font-size="26" fill="#f0c879" opacity="0.25" font-weight="700" text-anchor="middle">[openLCA]</text>
  </g>
  <text x="88" y="1140" font-size="9.5" fill="#8ba3c7">In the 420-wide data canvas the three panels stack as equidistant ROWS (one impact per row, four bars each) — drawn side by side here only for review.</text>
  <text x="88" y="1160" font-size="9.5" fill="#8ba3c7">Values print above each bar; no shared axis exists, so no axis lies.</text>

  <!-- ================= TAB 4: RECYCLING ================= -->
  <rect x="1100" y="700" width="520" height="500" rx="24" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <text x="1128" y="732" font-size="12" font-weight="700" fill="#2eb086">RECYCLING — unchanged from v1, footer removed</text>
  <g font-size="9.5" fill="#8ba3c7">
    <text x="1128" y="760"><tspan fill="#dbe4f0" font-weight="700">Sc1</tspan> baseline · <tspan fill="#dbe4f0" font-weight="700">Sc2</tspan> bulk shredding · <tspan fill="#dbe4f0" font-weight="700">Sc3</tspan> guided (AR-DPP) · <tspan fill="#dbe4f0" font-weight="700">Sc4</tspan> reuse</text>
  </g>
  <!-- one representative mini panel (minerals), true values -->
  <g>
    <text x="1148" y="800" font-size="9.5" fill="#dbe4f0" font-weight="700">Minerals &amp; metals · gross 0.0187 kg Sb eq</text>
    <line x1="1140" y1="990" x2="1400" y2="990" stroke="#1a335f"/>
    <rect x="1150" y="840" width="40" height="150" fill="#1f77b4"/>
    <rect x="1210" y="855" width="40" height="135" fill="#1f77b4"/><rect x="1210" y="840" width="40" height="15" fill="#2eb086"/>
    <rect x="1270" y="888" width="40" height="102" fill="#1f77b4"/><rect x="1270" y="840" width="40" height="48" fill="#2eb086"/>
    <rect x="1330" y="910" width="40" height="80" fill="#1f77b4"/><rect x="1330" y="840" width="40" height="70" fill="#2eb086"/>
    <g font-size="8.5" fill="#2eb086" text-anchor="middle">
      <text x="1230" y="834">−10%</text><text x="1290" y="834">−32%</text><text x="1350" y="834">−47%</text>
    </g>
    <g font-size="8.5" fill="#8ba3c7" text-anchor="middle">
      <text x="1170" y="1004">Sc1</text><text x="1230" y="1004">Sc2</text><text x="1290" y="1004">Sc3</text><text x="1350" y="1004">Sc4</text>
    </g>
  </g>
  <text x="1128" y="1036" font-size="9" fill="#8ba3c7">+ the climate (−6/−11/−21 %) and eutrophication (−6/−17/−26 %) panels,</text>
  <text x="1128" y="1050" font-size="9" fill="#8ba3c7">equidistant rows in the canvas, same net/credit grammar.</text>
  <g font-size="9" fill="#8ba3c7">
    <rect x="1128" y="1076" width="14" height="10" fill="#1f77b4"/><text x="1148" y="1085">net impact</text>
    <rect x="1240" y="1076" width="14" height="10" fill="#2eb086"/><text x="1260" y="1085">avoided burden (credit)</text>
  </g>

  <!-- ================= decisions ================= -->
  <rect x="60" y="1230" width="1560" height="72" rx="18" fill="none" stroke="#f0c879" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="84" y="1258" font-size="13" font-weight="700" fill="#f0c879">REMAINING DECISIONS</text>
  <text x="84" y="1282" font-size="11" fill="#dbe4f0">1 · Per-stage + pareto data: I write an openLCA-IPC extraction script (calc each product system → contribution tree → 3 categories × S1–S4 + screening shares) feeding the payload-v0.19 generator. Fallback if the IPC server misbehaves: you export the three trees from the GUI and I parse them. 2 · Everything else from v1 stands (static ring · no model tint).</text>
</svg>
