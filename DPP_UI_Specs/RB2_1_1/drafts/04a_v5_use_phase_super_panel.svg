<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1560" viewBox="0 0 1680 1560" font-family="'Segoe UI','SF Pro Display',Arial,sans-serif">
  <rect width="1680" height="1560" fill="#0a1526"/>

  <!-- ================= header ================= -->
  <text x="60" y="50" font-size="21" font-weight="700" fill="#dbe4f0">04a · USAGE &amp; SERVICE — v5 mock (super panel adaptation)</text>
  <text x="60" y="76" font-size="13" fill="#8ba3c7">Five lenses re-tint the STAGE MODEL through the model link · pinch on this tab opens the part's USAGE RECORD · every number below is the real payload value (v0.18) with its §4 derivation · 2026-08-09</text>

  <!-- ================= main row: rail · stage · data ================= -->

  <!-- RAIL (dimmed context) -->
  <g opacity="0.55">
    <rect x="60" y="110" width="240" height="470" rx="22" fill="#081733" stroke="#1a335f"/>
    <rect x="78" y="130" width="204" height="40" rx="13" fill="#0d2144" stroke="#e24b4a" stroke-width="1.5"/>
    <text x="180" y="155" font-size="11" fill="#dbe4f0" text-anchor="middle">Certificates &amp; safety</text>
    <rect x="78" y="182" width="204" height="52" rx="13" fill="#0d2144" stroke="#21407a"/>
    <text x="180" y="212" font-size="11" fill="#8ba3c7" text-anchor="middle">Product specifications</text>
  </g>
  <rect x="78" y="246" width="204" height="52" rx="13" fill="#16305c" stroke="#2eb086" stroke-width="2"/>
  <rect x="78" y="256" width="4" height="32" rx="2" fill="#2eb086"/>
  <text x="184" y="270" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Usage &amp;</text>
  <text x="184" y="286" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">service</text>
  <g opacity="0.55">
    <rect x="78" y="310" width="204" height="52" rx="13" fill="#0d2144" stroke="#21407a"/>
    <text x="180" y="340" font-size="11" fill="#8ba3c7" text-anchor="middle">Environmental impact</text>
    <rect x="78" y="374" width="204" height="52" rx="13" fill="#0d2144" stroke="#21407a"/>
    <text x="180" y="404" font-size="11" fill="#8ba3c7" text-anchor="middle">Training disassembly</text>
  </g>

  <!-- STAGE: model tinted by REUSE verdicts (the default lens) -->
  <text x="560" y="128" font-size="10.5" fill="#5d7396" text-anchor="middle">STAGE — Reuse lens tints the exploded model BY VERDICT (0.767 legible as colour)</text>
  <g transform="rotate(-7 560 360)">
    <g stroke="#2eb086" stroke-width="2.5"><line x1="496" y1="188" x2="496" y2="204"/><line x1="540" y1="182" x2="540" y2="198"/><line x1="600" y1="178" x2="600" y2="194"/><line x1="644" y1="184" x2="644" y2="200"/></g>
    <path d="M482,218 L648,206 L668,222 L502,236 Z" fill="#2eb086"/>
    <path d="M502,236 L668,222 L668,234 L502,248 Z" fill="#1f8062"/>
    <text x="700" y="228" font-size="10" fill="#2eb086">shells + screws = reuse (teal)</text>
    <rect x="512" y="272" width="26" height="10" fill="#21407a" transform="skewX(-6)"/>
    <rect x="548" y="270" width="20" height="10" fill="#21407a" transform="skewX(-6)"/>
    <rect x="578" y="268" width="30" height="10" fill="#21407a" transform="skewX(-6)"/>
    <rect x="618" y="266" width="18" height="10" fill="#21407a" transform="skewX(-6)"/>
    <text x="700" y="282" font-size="10" fill="#5d7396">ICs + PCB = material recovery</text>
    <text x="700" y="296" font-size="10" fill="#5d7396">(navy — deliberately NOT red)</text>
    <path d="M486,302 L652,290 L670,304 L504,316 Z" fill="#21407a"/>
    <path d="M504,316 L670,304 L670,311 L504,323 Z" fill="#182f57"/>
    <g>
      <circle cx="518" cy="352" r="15" fill="#f0c879" stroke="#c79c4f" stroke-width="4"/>
      <circle cx="568" cy="348" r="15" fill="#f0c879" stroke="#c79c4f" stroke-width="4"/>
      <circle cx="618" cy="344" r="15" fill="#f0c879" stroke="#c79c4f" stroke-width="4"/>
    </g>
    <text x="700" y="352" font-size="10" fill="#f0c879">connectors = reuse after test (gold)</text>
    <path d="M478,386 L650,372 L672,392 L500,406 Z" fill="#33a184"/>
    <path d="M500,406 L672,392 L672,450 L500,464 Z" fill="#2eb086"/>
    <path d="M478,386 L500,406 L500,464 L478,444 Z" fill="#1f8062"/>
  </g>
  <!-- lock column, collapsed -->
  <rect x="806" y="150" width="40" height="64" rx="12" fill="#2e5aa0" fill-opacity="0.62"/>
  <circle cx="826" cy="172" r="14" fill="#0a1f44"/>
  <rect x="820" y="169" width="12" height="9" rx="2" fill="none" stroke="#f28c28" stroke-width="2"/>
  <path d="M822,169 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#f28c28" stroke-width="2"/>
  <text x="826" y="200" font-size="6.5" font-weight="700" fill="#f28c28" text-anchor="middle">LINKED</text>

  <!-- DATA CANVAS: the Reuse lens page (default) -->
  <rect x="880" y="110" width="560" height="574" rx="24" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <text x="908" y="146" font-size="16" font-weight="700" fill="#dbe4f0">Usage &amp; service</text>
  <text x="908" y="164" font-size="9.5" fill="#5d7396">telemetry the unit records about itself · basis: simulated</text>
  <line x1="908" y1="176" x2="1412" y2="176" stroke="#1a335f" stroke-width="1.5"/>

  <!-- lens pill row -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="908" y="188" width="96" height="30" rx="15" fill="#16305c" stroke="#2eb086" stroke-width="1.5"/>
    <text x="956" y="207" fill="#ffffff" font-weight="700">Reuse</text>
    <rect x="1010" y="188" width="96" height="30" rx="15" fill="#0E2950" stroke="#21407a"/>
    <text x="1058" y="207" fill="#8ba3c7">Thermal</text>
    <rect x="1112" y="188" width="96" height="30" rx="15" fill="#0E2950" stroke="#21407a"/>
    <text x="1160" y="207" fill="#8ba3c7">Electrical</text>
    <rect x="1214" y="188" width="96" height="30" rx="15" fill="#0E2950" stroke="#21407a"/>
    <text x="1262" y="207" fill="#8ba3c7">Data</text>
    <rect x="1316" y="188" width="96" height="30" rx="15" fill="#0E2950" stroke="#21407a"/>
    <text x="1364" y="207" fill="#8ba3c7">History</text>
  </g>

  <!-- SOH block -->
  <text x="908" y="252" font-size="9.5" letter-spacing="1.5" fill="#2eb086">STATE OF HEALTH — min of mechanisms, no invented weights (§4.4)</text>
  <text x="908" y="292" font-size="34" font-weight="700" fill="#dbe4f0">48 %</text>
  <text x="1000" y="278" font-size="10.5" fill="#8ba3c7">limiting mechanism: thermal fatigue</text>
  <text x="1000" y="293" font-size="10.5" fill="#8ba3c7">a part fails at its weakest mechanism,</text>
  <text x="1000" y="308" font-size="10.5" fill="#8ba3c7">not at the mean of them</text>

  <!-- indicator bars -->
  <text x="908" y="336" font-size="10" fill="#dbe4f0">Flash endurance</text>
  <rect x="1040" y="327" width="200" height="9" rx="4" fill="#0a1a38"/>
  <rect x="1040" y="327" width="110" height="9" rx="4" fill="#f0c879"/>
  <text x="1256" y="336" font-size="10" fill="#dbe4f0">55 % (counted, hard limit)</text>
  <text x="908" y="358" font-size="10" fill="#dbe4f0">Thermal fatigue</text>
  <rect x="1040" y="349" width="200" height="9" rx="4" fill="#0a1a38"/>
  <rect x="1040" y="349" width="96" height="9" rx="4" fill="#f0c879"/>
  <text x="1256" y="358" font-size="10" fill="#dbe4f0">48 % (Coffin-Manson + Miner)</text>

  <!-- reuse fraction -->
  <rect x="908" y="376" width="504" height="34" rx="10" fill="#0E2950"/>
  <text x="922" y="397" font-size="11" fill="#2eb086" font-weight="700">0.767 of the unit's mass carries a reuse verdict</text>
  <text x="1180" y="397" font-size="9.5" fill="#8ba3c7">→ inside Sc4's declared [A] 0.5–0.9 band (§2)</text>

  <!-- verdict legend -->
  <g font-size="9.5" fill="#8ba3c7">
    <circle cx="916" cy="430" r="5" fill="#2eb086"/><text x="928" y="434">reuse 356.0 g</text>
    <circle cx="1030" cy="430" r="5" fill="#f0c879"/><text x="1042" y="434">reuse after test 150.1 g</text>
    <circle cx="1196" cy="430" r="5" fill="#21407a"/><text x="1208" y="434">material recovery 146.1 g</text>
    <circle cx="1364" cy="430" r="5" fill="#6f86a8"/><text x="1376" y="434">consumable 8.0 g</text>
  </g>

  <!-- findings -->
  <text x="908" y="464" font-size="9.5" letter-spacing="1.5" fill="#5d7396">FINDINGS — reported, NOT scored (§4.4)</text>
  <rect x="908" y="474" width="504" height="26" rx="8" fill="#0a1a38"/>
  <text x="920" y="491" font-size="10" fill="#dbe4f0">Over-temperature exposure</text>
  <text x="1150" y="491" font-size="10" fill="#8ba3c7">41 h above the 80 °C limit · peak 94 °C</text>
  <rect x="908" y="504" width="504" height="26" rx="8" fill="#0a1a38"/>
  <text x="920" y="521" font-size="10" fill="#dbe4f0">Processor failure 2025-12</text>
  <text x="1150" y="521" font-size="10" fill="#8ba3c7">replaced at 220,260 km · heat implicated</text>

  <!-- bottom bar -->
  <rect x="908" y="608" width="90" height="34" rx="17" fill="#10264a" stroke="#5d7396"/>
  <text x="953" y="630" font-size="11" fill="#dbe4f0" text-anchor="middle">Back</text>
  <rect x="1240" y="608" width="172" height="34" rx="17" fill="#2eb086"/>
  <text x="1326" y="630" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Next / Scan next product</text>

  <!-- ================= second row: the four other lens states ================= -->
  <text x="60" y="740" font-size="14" font-weight="700" fill="#dbe4f0">The other four lenses — same page frame, content region swaps, model re-tints. Pills never open a new screen (spec §7.2).</text>

  <!-- THERMAL -->
  <rect x="60" y="762" width="384" height="330" rx="18" fill="#0d2144" stroke="#1a335f"/>
  <text x="80" y="790" font-size="12" font-weight="700" fill="#f08a3c">THERMAL</text>
  <text x="150" y="790" font-size="9" fill="#8ba3c7">model: heat ramp — processors hottest (#f08a3c), PCB warm, rest neutral</text>
  <text x="80" y="812" font-size="10.5" fill="#dbe4f0">fatigue life consumed 51.6 % · remaining 48 %</text>
  <text x="80" y="836" font-size="9" letter-spacing="1" fill="#5d7396">ΔT BAND · CYCLES · DAMAGE — the table IS the argument (§4.2)</text>
  <g font-size="9.5" fill="#dbe4f0">
    <text x="80" y="856">below 20 °C</text><text x="180" y="856">4,200</text><rect x="230" y="848" width="23" height="8" rx="3" fill="#f08a3c" opacity="0.55"/><text x="366" y="856" text-anchor="end">0.039</text>
    <text x="80" y="876">20–40 °C</text><text x="180" y="876">4,600</text><rect x="230" y="868" width="99" height="8" rx="3" fill="#f08a3c" opacity="0.75"/><text x="366" y="876" text-anchor="end">0.173</text>
    <text x="80" y="896">40–60 °C</text><text x="180" y="896">2,000</text><rect x="230" y="888" width="120" height="8" rx="3" fill="#f08a3c"/><text x="366" y="896" text-anchor="end">0.208</text>
    <text x="80" y="916">60–80 °C</text><text x="180" y="916">420</text><rect x="230" y="908" width="49" height="8" rx="3" fill="#f08a3c" opacity="0.65"/><text x="366" y="916" text-anchor="end">0.086</text>
    <text x="80" y="936">above 80 °C</text><text x="180" y="936">30</text><rect x="230" y="928" width="6" height="8" rx="3" fill="#f08a3c" opacity="0.55"/><text x="366" y="936" text-anchor="end">0.010</text>
  </g>
  <line x1="80" y1="948" x2="366" y2="948" stroke="#1a335f"/>
  <text x="80" y="966" font-size="9.5" fill="#8ba3c7">Σ Miner damage D = 0.516 → 48 % remaining</text>
  <text x="80" y="988" font-size="9" fill="#5d7396">the 30 worst cycles are 1 % of the damage; the 2,000</text>
  <text x="80" y="1001" font-size="9" fill="#5d7396">mid-range ones are 21 % — a cycle counter cannot see this</text>
  <text x="80" y="1026" font-size="8.5" fill="#5d7396">ref: N=15,000 @ ΔT 40 °C, n=2.0 (conservative) · assumptions A2/A3</text>
  <text x="80" y="1070" font-size="9" fill="#f0c879">⚠ #f08a3c is NOT in the 00 palette — needs a heat/high token (decision 1)</text>

  <!-- ELECTRICAL -->
  <rect x="472" y="762" width="384" height="330" rx="18" fill="#0d2144" stroke="#1a335f"/>
  <text x="492" y="790" font-size="12" font-weight="700" fill="#4da3ff">ELECTRICAL</text>
  <text x="590" y="790" font-size="9" fill="#8ba3c7">model: connectors lit blue, rest neutral</text>
  <g font-size="10.5">
    <text x="492" y="826" fill="#8ba3c7">Voltage transients logged</text><text x="836" y="826" fill="#dbe4f0" text-anchor="end">2,180 (ISO 7637-2)</text>
    <text x="492" y="854" fill="#8ba3c7">Undervoltage events</text><text x="836" y="854" fill="#dbe4f0" text-anchor="end">37</text>
    <text x="492" y="882" fill="#8ba3c7">Load dumps</text><text x="836" y="882" fill="#dbe4f0" text-anchor="end">4</text>
  </g>
  <rect x="492" y="900" width="344" height="52" rx="10" fill="#0a1a38"/>
  <text x="504" y="920" font-size="9.5" fill="#8ba3c7">Undervoltage events cluster around the two auxiliary</text>
  <text x="504" y="934" font-size="9.5" fill="#8ba3c7">12 V battery failures (2012, 2020) — telemetry meets</text>
  <text x="504" y="948" font-size="9.5" fill="#8ba3c7">the service log.</text>

  <!-- DATA -->
  <rect x="884" y="762" width="384" height="330" rx="18" fill="#0d2144" stroke="#1a335f"/>
  <text x="904" y="790" font-size="12" font-weight="700" fill="#4da3ff">DATA</text>
  <text x="952" y="790" font-size="9" fill="#8ba3c7">model: flash IC (ic_1) + bus interface (ic_4) lit</text>
  <g font-size="10">
    <text x="904" y="822" fill="#8ba3c7">Flash write cycles</text><text x="1248" y="822" fill="#dbe4f0" text-anchor="end">45,000 / 100,000 · 55 % left</text>
    <text x="904" y="847" fill="#8ba3c7">CPU above 80 % load</text><text x="1248" y="847" fill="#dbe4f0" text-anchor="end">675 h</text>
    <text x="904" y="872" fill="#8ba3c7">ECC corrected errors</text><text x="1248" y="872" fill="#dbe4f0" text-anchor="end">118</text>
    <text x="904" y="897" fill="#8ba3c7">Unexpected resets</text><text x="1248" y="897" fill="#dbe4f0" text-anchor="end">9</text>
    <text x="904" y="922" fill="#8ba3c7">CAN</text><text x="1248" y="922" fill="#dbe4f0" text-anchor="end">8,640 error frames · 6 bus-off</text>
    <text x="904" y="947" fill="#8ba3c7">Diagnostic codes</text><text x="1248" y="947" fill="#dbe4f0" text-anchor="end">41 total · 1 active · 40 cleared</text>
  </g>
  <text x="904" y="978" font-size="9" fill="#5d7396">flash is the COUNTED limit (hard); everything else is context</text>

  <!-- HISTORY -->
  <rect x="1296" y="762" width="324" height="330" rx="18" fill="#0d2144" stroke="#1a335f"/>
  <text x="1316" y="790" font-size="12" font-weight="700" fill="#dbe4f0">HISTORY</text>
  <text x="1390" y="790" font-size="9" fill="#8ba3c7">model: untinted (non-spatial)</text>
  <g font-size="10">
    <text x="1316" y="822" fill="#8ba3c7">Firmware</text><text x="1600" y="822" fill="#dbe4f0" text-anchor="end">15 versions · v1.0 → v15.0</text>
    <text x="1316" y="847" fill="#8ba3c7">Calibration map changes</text><text x="1600" y="847" fill="#dbe4f0" text-anchor="end">6</text>
    <text x="1316" y="872" fill="#8ba3c7">Sensor recalibrations</text><text x="1600" y="872" fill="#dbe4f0" text-anchor="end">3</text>
  </g>
  <rect x="1316" y="892" width="284" height="64" rx="10" fill="#0a1a38"/>
  <text x="1328" y="912" font-size="9.5" fill="#8ba3c7">13 diagnostic codes tie to logged service events —</text>
  <text x="1328" y="926" font-size="9.5" fill="#8ba3c7">the unit raises codes for the whole vehicle, which is</text>
  <text x="1328" y="940" font-size="9.5" fill="#8ba3c7">why the service log carries vehicle systems too (§4.6).</text>
  <text x="1316" y="982" font-size="9" fill="#f0c879">⚠ payload has COUNTS only, no itemised firmware/service</text>
  <text x="1316" y="996" font-size="9" fill="#f0c879">rows — so no scroll list. Confirm counts-only (decision 3)</text>

  <!-- ================= third row: part record + decisions ================= -->
  <rect x="60" y="1120" width="560" height="270" rx="18" fill="#0d2144" stroke="#2eb086" stroke-width="1.5"/>
  <text x="80" y="1150" font-size="13" font-weight="700" fill="#2eb086">PART RECORD — pinch a body on THIS tab (replaces lens content)</text>
  <text x="80" y="1178" font-size="15" font-weight="700" fill="#dbe4f0">Connectors 3× AS018-35</text>
  <circle cx="90" cy="1200" r="6" fill="#f0c879"/>
  <text x="104" y="1204" font-size="11" fill="#f0c879">reuse after test</text>
  <text x="240" y="1204" font-size="11" fill="#8ba3c7">150.1 g</text>
  <rect x="80" y="1218" width="500" height="60" rx="10" fill="#0a1a38"/>
  <text x="92" y="1238" font-size="10" fill="#8ba3c7">One SENS-B reseat logged 2022 — contact resistance to be verified</text>
  <text x="92" y="1252" font-size="10" fill="#8ba3c7">before reuse. Verdicts follow the evidence on this screen, not a</text>
  <text x="92" y="1266" font-size="10" fill="#8ba3c7">rule of thumb (§4.5).</text>
  <rect x="80" y="1296" width="90" height="30" rx="15" fill="#10264a" stroke="#5d7396"/>
  <text x="125" y="1315" font-size="10.5" fill="#dbe4f0" text-anchor="middle">Back</text>
  <text x="80" y="1352" font-size="9.5" fill="#8ba3c7">model: selected part keeps true colour, the rest GHOST (α 0.30) — same</text>
  <text x="80" y="1366" font-size="9.5" fill="#8ba3c7">machinery as Component ID. Record's Back returns to the active lens.</text>

  <!-- decisions -->
  <rect x="648" y="1120" width="972" height="270" rx="18" fill="none" stroke="#f0c879" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="672" y="1150" font-size="13" font-weight="700" fill="#f0c879">DECISIONS BEFORE CODE</text>
  <text x="672" y="1178" font-size="11" fill="#dbe4f0">1 · Heat ramp colour #f08a3c is outside the 00 palette — approve it as a new `heat/high` token, or the Thermal lens tops out in gold (which already means "high value").</text>
  <text x="672" y="1204" font-size="11" fill="#dbe4f0">2 · SOH display: big number + named limiting mechanism (as drawn) — no gauge, no red band (red keeps its four reserved meanings and appears nowhere on this screen).</text>
  <text x="672" y="1230" font-size="11" fill="#dbe4f0">3 · History = counts only. The payload carries totals (15 firmware, 6 maps, 3 recals), not itemised rows — the spec's scrollable 15-row list has no data behind it.</text>
  <text x="672" y="1256" font-size="11" fill="#dbe4f0">4 · Lens→model tint map: Reuse = verdict colours · Thermal = ic_1 hottest, other ICs mid, PCB warm · Electrical = connectors lit · Data = ic_1 + ic_4 lit · History = clear.</text>
  <text x="672" y="1282" font-size="11" fill="#dbe4f0">5 · Pinch on a GHOSTED body while a record is open: switches the record to that part (no back-out needed). Screws stay non-selectable everywhere.</text>
  <text x="672" y="1320" font-size="10.5" fill="#8ba3c7">Data provenance: every figure computed per spec §4 from the payload (ignition 11,250 → Coffin-Manson/Miner D=0.516 → SOH 48 % = min(55, 48) → reuse 0.767 by mass).</text>
  <text x="672" y="1338" font-size="10.5" fill="#8ba3c7">Assumptions A1–A7 stay in the spec's register; A2/A3/A5 are the ones the thesis must state. basis: "simulated" is printed under the page title.</text>
  <text x="672" y="1366" font-size="10.5" fill="#8ba3c7">Build plan on approval: UsePhaseView.cs + RBv2_1_1/3 phase + lens-tint/pick-routing additions to the model link. No changes to LINKED/FREE behaviour.</text>
</svg>
