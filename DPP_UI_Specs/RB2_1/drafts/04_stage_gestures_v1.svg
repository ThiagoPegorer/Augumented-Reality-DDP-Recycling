<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1130" viewBox="0 0 1680 1130" font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2eb086"/>
    </marker>
  </defs>

  <rect width="1680" height="1130" fill="#0a1526"/>

  <!-- ================= header ================= -->
  <text x="60" y="52" font-size="21" font-weight="700" fill="#dbe4f0">04 · Super panel — STAGE GESTURES v1 (mock)</text>
  <text x="60" y="78" font-size="13" fill="#8ba3c7">Action-zone parity on the model panel · source: spec 10 v4.6.2 (device-validated) · link control moves into the rail · drag gated behind FREE · 2026-08-08</text>

  <!-- ================= RAIL ================= -->
  <rect x="60" y="120" width="308" height="602" rx="26" fill="#081733" stroke="#1a335f" stroke-width="1.5"/>

  <!-- certificates -->
  <rect x="84" y="150" width="260" height="56" rx="18" fill="#0d2144" stroke="#e24b4a" stroke-width="2"/>
  <circle cx="118" cy="178" r="11" fill="#e24b4a" opacity="0.85"/>
  <text x="140" y="183" font-size="13" fill="#dbe4f0">Certificates &amp; safety</text>

  <!-- tab 0 active -->
  <rect x="84" y="222" width="260" height="60" rx="18" fill="#16305c" stroke="#2eb086" stroke-width="1.5"/>
  <rect x="84" y="236" width="4" height="32" rx="2" fill="#2eb086"/>
  <rect x="106" y="238" width="24" height="24" rx="5" fill="#2eb086" opacity="0.75"/>
  <text x="144" y="248" font-size="13" font-weight="700" fill="#ffffff">Product</text>
  <text x="144" y="266" font-size="13" font-weight="700" fill="#ffffff">specifications</text>

  <!-- tab 1 -->
  <rect x="84" y="294" width="260" height="60" rx="18" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <rect x="106" y="310" width="24" height="24" rx="5" fill="#2eb086" opacity="0.35"/>
  <text x="144" y="320" font-size="13" fill="#8ba3c7">Usage &amp;</text>
  <text x="144" y="338" font-size="13" fill="#8ba3c7">service</text>

  <!-- tab 2 -->
  <rect x="84" y="366" width="260" height="60" rx="18" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <rect x="106" y="382" width="24" height="24" rx="5" fill="#2eb086" opacity="0.35"/>
  <text x="144" y="392" font-size="13" fill="#8ba3c7">Environmental</text>
  <text x="144" y="410" font-size="13" fill="#8ba3c7">impact</text>

  <!-- tab 3 -->
  <rect x="84" y="438" width="260" height="60" rx="18" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
  <rect x="106" y="454" width="24" height="24" rx="5" fill="#2eb086" opacity="0.35"/>
  <text x="144" y="464" font-size="13" fill="#8ba3c7">Training</text>
  <text x="144" y="482" font-size="13" fill="#8ba3c7">disassembly</text>

  <!-- divider + NEW model-link control -->
  <line x1="96" y1="530" x2="332" y2="530" stroke="#1a335f" stroke-width="1.5"/>
  <text x="96" y="556" font-size="10" letter-spacing="2" fill="#8ba3c7">MODEL</text>

  <rect x="84" y="568" width="260" height="72" rx="18" fill="#10264a" stroke="#f0c879" stroke-width="2"/>
  <circle cx="122" cy="604" r="17" fill="#0d2144" stroke="#f0c879" stroke-width="2.5"/>
  <rect x="115" y="600" width="14" height="11" rx="2.5" fill="none" stroke="#f0c879" stroke-width="2"/>
  <path d="M118,600 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#f0c879" stroke-width="2"/>
  <text x="152" y="598" font-size="13.5" font-weight="700" fill="#f0c879">Model link</text>
  <text x="152" y="618" font-size="10.5" fill="#8ba3c7">LINKED · tap to set the model FREE</text>
  <text x="152" y="632" font-size="10.5" fill="#8ba3c7">FREE · tap to re-link (instant)</text>

  <!-- rail annotation -->
  <path d="M348,604 h56" stroke="#f0c879" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
  <text x="360" y="662" font-size="11" fill="#f0c879">the LINKED / FREE control leaves the</text>
  <text x="360" y="677" font-size="11" fill="#f0c879">stage and becomes the rail's last entry</text>

  <!-- ================= STAGE (transparent) ================= -->
  <rect x="392" y="120" width="560" height="602" rx="26" fill="none" stroke="#2eb086" stroke-opacity="0.30" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="672" y="145" font-size="10.5" fill="#5d7396" text-anchor="middle">stage — no surface, no fill · iso pose 25° / 205° · exploded on entry · sits LOW</text>

  <!-- ..... the model (fake iso, exploded, low) ..... -->
  <g transform="rotate(-7 660 470)">
    <!-- lid screws -->
    <g stroke="#9aa7b8" stroke-width="2.5">
      <line x1="596" y1="288" x2="596" y2="306"/><line x1="640" y1="282" x2="640" y2="300"/>
      <line x1="700" y1="278" x2="700" y2="296"/><line x1="744" y1="284" x2="744" y2="302"/>
    </g>
    <!-- lid (brown, iso) -->
    <path d="M582,318 L748,306 L768,322 L602,336 Z" fill="#8a5a3b"/>
    <path d="M602,336 L768,322 L768,334 L602,348 Z" fill="#6e4527"/>
    <!-- chips row -->
    <rect x="612" y="372" width="26" height="10" fill="#E0C14A" transform="skewX(-6)"/>
    <rect x="648" y="370" width="20" height="10" fill="#003C99" transform="skewX(-6)"/>
    <rect x="678" y="368" width="30" height="10" fill="#CB3636" transform="skewX(-6)"/>
    <rect x="718" y="366" width="18" height="10" fill="#8F5110" transform="skewX(-6)"/>
    <!-- PCB -->
    <path d="M586,402 L752,390 L770,404 L604,416 Z" fill="#2e7d4f"/>
    <path d="M604,416 L770,404 L770,411 L604,423 Z" fill="#1f5c38"/>
    <!-- connectors -->
    <g>
      <circle cx="618" cy="452" r="15" fill="#2e7d4f" stroke="#1f5c38" stroke-width="4"/>
      <circle cx="668" cy="448" r="15" fill="#2e7d4f" stroke="#1f5c38" stroke-width="4"/>
      <circle cx="718" cy="444" r="15" fill="#2e7d4f" stroke="#1f5c38" stroke-width="4"/>
    </g>
    <!-- bottom shell -->
    <path d="M578,486 L750,472 L772,492 L600,506 Z" fill="#a06a45"/>
    <path d="M600,506 L772,492 L772,550 L600,564 Z" fill="#8a5a3b"/>
    <path d="M578,486 L600,506 L600,564 L578,544 Z" fill="#6e4527"/>
    <circle cx="646" cy="530" r="9" fill="#4a2f1a"/>
    <circle cx="686" cy="527" r="9" fill="#4a2f1a"/>
    <circle cx="726" cy="524" r="9" fill="#4a2f1a"/>
  </g>

  <!-- ..... gesture affordances ..... -->
  <!-- twist yaw arcs -->
  <path d="M540,470 A150,54 0 0 1 588,428" fill="none" stroke="#4da3ff" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M810,410 A150,54 0 0 1 772,458" fill="none" stroke="#4da3ff" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="470" y="508" font-size="11" fill="#4da3ff">TWIST — both hands pinch,</text>
  <text x="470" y="523" font-size="11" fill="#4da3ff">5–25 cm apart → yaw 1:1</text>

  <!-- zoom dial -->
  <path d="M812,318 L850,286" stroke="#4da3ff" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="770" y="266" font-size="11" fill="#4da3ff">DIAL — hands &gt; 25 cm apart</text>
  <text x="770" y="281" font-size="11" fill="#4da3ff">= absolute zoom, 1× → 1.5× cap</text>

  <!-- pinch select -->
  <circle cx="736" cy="446" r="5" fill="#2eb086"/>
  <path d="M741,446 C790,446 800,410 838,396" fill="none" stroke="#2eb086" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrT)"/>
  <text x="700" y="592" font-size="11" fill="#2eb086">PINCH a body → stays "select":</text>
  <text x="700" y="607" font-size="11" fill="#2eb086">rail → Product specs, its page opens</text>

  <!-- gesture HUD column -->
  <rect x="880" y="330" width="48" height="196" rx="10" fill="#2e5aa0" fill-opacity="0.62"/>
  <circle cx="904" cy="352" r="11" fill="#0a1f44"/><text x="904" y="356" font-size="11" fill="#dbe4f0" text-anchor="middle">?</text>
  <circle cx="895" cy="378" r="6" fill="#27c46c"/><circle cx="913" cy="378" r="6" fill="none" stroke="#5d7396" stroke-width="2"/>
  <rect x="886" y="394" width="36" height="16" rx="4" fill="#0a1f44"/><text x="904" y="405" font-size="7.5" fill="#4da3ff" text-anchor="middle">YAW 205°</text>
  <rect x="886" y="414" width="36" height="16" rx="4" fill="#0a1f44"/><text x="904" y="425" font-size="7.5" fill="#dbe4f0" text-anchor="middle">DIST —</text>
  <rect x="886" y="434" width="36" height="16" rx="4" fill="#0a1f44"/><text x="904" y="445" font-size="7.5" fill="#dbe4f0" text-anchor="middle">ZOOM 1.0×</text>
  <text x="904" y="472" font-size="8" fill="#8ba3c7" text-anchor="middle">no [+] list</text>
  <text x="904" y="484" font-size="8" fill="#8ba3c7" text-anchor="middle">no ⟲ regroup</text>
  <text x="904" y="496" font-size="8" fill="#8ba3c7" text-anchor="middle">(see decisions)</text>
  <path d="M928,352 h34" stroke="#8ba3c7" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="938" y="336" font-size="10" fill="#8ba3c7">HUD column (spec 10 §3.2),</text>
  <text x="938" y="350" font-size="10" fill="#8ba3c7">pinned to the model's side,</text>
  <text x="938" y="364" font-size="10" fill="#8ba3c7">chips always live</text>

  <!-- grab circle, gated -->
  <g opacity="0.45">
    <circle cx="672" cy="668" r="12" fill="#000000" stroke="#5d7396" stroke-width="1.5"/>
    <circle cx="672" cy="668" r="4" fill="#9aa7b8"/>
  </g>
  <rect x="690" y="654" width="11" height="9" rx="2" fill="none" stroke="#f0c879" stroke-width="1.8"/>
  <path d="M692,654 v-3 a3.5,3.5 0 0 1 7,0 v3" fill="none" stroke="#f0c879" stroke-width="1.8"/>
  <text x="712" y="664" font-size="11" fill="#f0c879">grab circle = MOVE drag —</text>
  <text x="712" y="679" font-size="11" fill="#f0c879">hidden while LINKED, appears on FREE</text>

  <!-- ================= DATA CANVAS (unchanged) ================= -->
  <g opacity="0.62">
    <rect x="976" y="120" width="588" height="602" rx="26" fill="#0d2144" stroke="#1a335f" stroke-width="1.5"/>
    <rect x="1006" y="150" width="250" height="40" rx="20" fill="#10264a" stroke="#5d7396"/>
    <text x="1131" y="175" font-size="13" fill="#8ba3c7" text-anchor="middle">Product ID</text>
    <rect x="1276" y="150" width="258" height="40" rx="20" fill="#16305c" stroke="#dbe4f0"/>
    <text x="1405" y="175" font-size="13" fill="#dbe4f0" text-anchor="middle">Component ID</text>
    <rect x="1006" y="212" width="528" height="330" rx="14" fill="#0a1a38"/>
    <g stroke="#c8d4e4" stroke-width="1.2" fill="none">
      <rect x="1080" y="248" width="180" height="120"/>
      <rect x="1300" y="248" width="44" height="120"/>
      <rect x="1090" y="404" width="200" height="60"/>
      <circle cx="1130" cy="434" r="12"/><circle cx="1180" cy="434" r="12"/><circle cx="1230" cy="434" r="12"/>
    </g>
    <rect x="1436" y="500" width="80" height="30" rx="15" fill="#2eb086"/>
    <text x="1476" y="520" font-size="12" fill="#ffffff" text-anchor="middle">View</text>
    <text x="1006" y="574" font-size="10" fill="#2eb086">MATERIAL</text>
    <text x="1006" y="596" font-size="12" fill="#dbe4f0">Aluminium   235.5 g</text>
    <rect x="1150" y="586" width="220" height="7" rx="3" fill="#2eb086"/>
    <rect x="1150" y="597" width="170" height="7" rx="3" fill="#1f77b4"/>
    <rect x="1006" y="640" width="110" height="34" rx="17" fill="#10264a" stroke="#5d7396"/>
    <text x="1061" y="662" font-size="12" fill="#dbe4f0" text-anchor="middle">All parts</text>
    <rect x="1476" y="640" width="58" height="34" rx="17" fill="#10264a" stroke="#5d7396"/>
    <text x="1505" y="662" font-size="12" fill="#dbe4f0" text-anchor="middle">i</text>
  </g>
  <text x="1270" y="710" font-size="11" fill="#8ba3c7" text-anchor="middle">data canvas — unchanged; pinch-select and page-open behave exactly as today</text>

  <!-- ================= state cards ================= -->
  <rect x="60" y="756" width="742" height="212" rx="18" fill="#0d2144" stroke="#2eb086" stroke-width="1.5"/>
  <text x="88" y="790" font-size="15" font-weight="700" fill="#2eb086">LINKED — the default, on the stage</text>
  <text x="88" y="820" font-size="12" fill="#dbe4f0">· Teardown plays on entry, stays open · iso pose 25°/205°, exploded pose sits low</text>
  <text x="88" y="842" font-size="12" fill="#dbe4f0">· NEW: two-hand TWIST yaws the model in place (about the stage centre)</text>
  <text x="88" y="864" font-size="12" fill="#dbe4f0">· NEW: two-hand DIAL zooms 1× → 1.5× cap — the model must never reach the side canvases</text>
  <text x="88" y="886" font-size="12" fill="#dbe4f0">· NEW: gesture HUD column pinned beside the model (help · hand lights · YAW / DIST / ZOOM)</text>
  <text x="88" y="908" font-size="12" fill="#dbe4f0">· Pinch a body = SELECT → Component ID page (unchanged — pinch never means "grab" here)</text>
  <text x="88" y="930" font-size="12" fill="#f0c879">· Grab circle hidden — the model cannot be dragged off the stage while LINKED</text>
  <text x="88" y="952" font-size="12" fill="#dbe4f0">· Yaw/zoom RESET to the iso home on tab change and on re-link (LINKED always means one pose family)</text>

  <rect x="826" y="756" width="742" height="212" rx="18" fill="#0d2144" stroke="#f0c879" stroke-width="1.5"/>
  <text x="854" y="790" font-size="15" font-weight="700" fill="#f0c879">FREE — after tapping the rail control</text>
  <text x="854" y="820" font-size="12" fill="#dbe4f0">· Everything LINKED has: twist yaw, dial zoom, HUD chips stay live</text>
  <text x="854" y="842" font-size="12" fill="#f0c879">· PLUS the grab circle appears under the model → pinch-drag repositions it anywhere in AR space</text>
  <text x="854" y="864" font-size="12" fill="#dbe4f0">· Ghost outline "return here to re-lock" on the stage, as today</text>
  <text x="854" y="886" font-size="12" fill="#dbe4f0">· Link CUT both ways: no highlight follows the canvas, pinch on a body does nothing (as today)</text>
  <text x="854" y="908" font-size="12" fill="#dbe4f0">· Re-link (rail control): instant open — no second teardown — snap home to the iso pose, re-select</text>
  <text x="854" y="930" font-size="12" fill="#dbe4f0">· Gesture arbitration per spec 10 §6.4: panel/rig grab always wins over twist and dial</text>

  <!-- ================= open decisions ================= -->
  <rect x="60" y="990" width="1508" height="112" rx="18" fill="none" stroke="#f0c879" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="88" y="1020" font-size="13" font-weight="700" fill="#f0c879">OPEN DECISIONS — answer before implementation</text>
  <text x="88" y="1046" font-size="12" fill="#dbe4f0">1 · Part axis-drag (spec 10 §6): NOT ported — on the stage a pinch already means "select". Dragging parts out stays the Training-disassembly / action-zone mechanic. Agree?</text>
  <text x="88" y="1068" font-size="12" fill="#dbe4f0">2 · [+] part list and ⟲ regroup: omitted — the stage model has no parked parts to regroup, and the parts list already exists as the Component ID page. Agree?</text>
  <text x="88" y="1090" font-size="12" fill="#dbe4f0">3 · Zoom cap 1.5× (zone allows 2×): at 2× the 173 mm open model becomes 346 mm on a 400-unit stage and clips both side canvases. 1.5× keeps 87 mm of margin. Agree?</text>
</svg>
